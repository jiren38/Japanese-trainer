<html lang="it"><head><meta charset="utf-8">

<title>Impariamo il giapponese – Studio</title>
<meta name="theme-color" content="#c2412d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2412d'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='serif'%3E%E8%AA%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ===== Design system ===== */
:root{--bg:#f6f3ec;--bg2:#efeadf;--card:#fffdf9;--tx:#1c1f26;--mu:#6b6f78;--ac:#c2412d;--ac-soft:#f6e1da;--ac2:#2f5d8a;--ac2-soft:#e2ebf4;--bd:#e4ddd0;--ok:#2f7d4f;--ok-soft:#dcefe2;--ko:#b3362b;--ko-soft:#f6dcd8;--shadow:0 1px 2px rgba(28,31,38,.05),0 6px 20px rgba(28,31,38,.06);--r:14px;--jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;--jps:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;--ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--bg2:#181b21;--card:#1d2027;--tx:#eceef2;--mu:#9aa0ab;--ac:#f07a63;--ac-soft:#3a2420;--ac2:#7fb0e0;--ac2-soft:#1e2a38;--bd:#2c313b;--ok:#5cc489;--ok-soft:#183325;--ko:#f07a6e;--ko-soft:#3a1f1d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--bg2:#181b21;--card:#1d2027;--tx:#eceef2;--mu:#9aa0ab;--ac:#f07a63;--ac-soft:#3a2420;--ac2:#7fb0e0;--ac2-soft:#1e2a38;--bd:#2c313b;--ok:#5cc489;--ok-soft:#183325;--ko:#f07a6e;--ko-soft:#3a1f1d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--ui);font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
:lang(ja),.big,.mid,.jp-example,.jp-answer,.ex-prompt,.ex-choice,.ex-tiles .btn,.day-cell,.li span,.kanji-hints{font-family:var(--ui),var(--jp)}
button{font-family:inherit}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
/* ===== Struttura ===== */
.app{max-width:980px;margin:0 auto;padding:0 20px 40px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--ac);color:#fff;font:700 23px/1 var(--jps);box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 35%,transparent);flex:none}
.brand-title{font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{color:var(--mu);font-size:13px;line-height:1.3}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;cursor:pointer}
.icon-btn:hover{border-color:var(--ac2)}
/* tabs */
.tabs{display:flex;gap:4px;padding:4px;margin:2px 0 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--mu);padding:9px 9px;border-radius:10px;font:500 13.5px/1.2 var(--ui);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab i{font-style:normal;font:700 15px/1 var(--jp);opacity:.85}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--card);color:var(--ac);box-shadow:var(--shadow)}
.tab .short{display:none}
/* barra unità */
.units{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.units-label{font-size:13px;font-weight:600;color:var(--mu);margin-right:4px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 13px;border-radius:999px;font:500 14px/1.2 var(--ui);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.units-soon{font-size:12px;color:var(--mu);margin-left:4px}
#v{min-height:50vh}
/* ===== Componenti di base ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px;border-radius:12px;font:500 15px/1.25 var(--ui);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd))}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.btn.ok:hover,.btn.ko:hover,.btn.on:hover{filter:brightness(1.05)}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1;font-weight:600}
.g{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.g b{color:var(--ac)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--ac2);background:var(--ac2-soft);padding:2px 9px;border-radius:999px}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),color-mix(in srgb,var(--ac2) 60%,var(--ok)));border-radius:99px;transition:width .3s}
.big{font:700 64px/1.15 var(--jps)}.mid{font:500 30px/1.35 var(--ui),var(--jp)}
.card>.mid:first-child{font-size:40px;font-weight:700}
.card .rd{color:var(--ac);font:500 20px/1.4 var(--ui),var(--jp)}.card .mean{font-size:20px;font-weight:500;max-width:32ch}
@media(max-width:900px) and (min-width:721px){.tab i{display:none}}
/* toolbar delle carte */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.seg{display:inline-flex;padding:3px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px}
.seg .btn{border:0;background:transparent;padding:8px 14px;border-radius:9px;color:var(--mu)}
.seg .btn.on{background:var(--card);color:var(--ac);box-shadow:var(--shadow)}
.toolbar .tool{padding:8px 12px;font-size:14px;border-radius:10px}
.toolbar .tool.on{background:var(--ac-soft);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.toolbar .spacer{flex:1}
/* flashcard */
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:30px 24px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.card:hover{box-shadow:0 2px 4px rgba(0,0,0,.06),0 14px 34px rgba(28,31,38,.1)}
.card .mid:first-child,.card .big:first-child{margin-top:4px}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mu);margin-bottom:6px}
.flip-hint{margin-top:8px;font-size:12px;color:var(--mu)}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;font:600 11px/1.4 var(--ui);color:var(--mu);background:var(--bg2)}
.kanji-pad-wrap{width:min(100%,420px);margin:8px auto 0;text-align:left}.kanji-pad{display:block;width:100%;height:200px;border:1px dashed var(--bd);border-radius:12px;background:var(--bg);touch-action:none;cursor:crosshair}.kanji-pad-label{font-size:13px;color:var(--mu);margin-bottom:5px}.kanji-hints{font-size:18px;line-height:1.7;display:flex;gap:22px;flex-wrap:wrap;justify-content:center}.kanji-clue{font-size:22px;font-weight:600}.kanji-pad-clear{margin-top:7px;padding:7px 10px;font-size:14px}.kanji-drawing-preview{display:block;width:min(100%,420px);height:150px;margin:10px auto 0;border:1px solid var(--bd);border-radius:12px;object-fit:contain;background:var(--bg)}.stroke-order-wrap{width:min(100%,320px);margin:10px auto 0}.stroke-order-svg{display:block;width:100%;height:auto;max-height:300px;background:var(--bg);border:1px solid var(--bd);border-radius:12px}.stroke-order-status{text-align:center;color:var(--mu);font-size:13px;margin:5px 0}.stroke-order-credit{text-align:center;color:var(--mu);font-size:11px;margin-top:5px}
/* elenco */
.list{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0}.li span{flex:1}.li.rm span{text-decoration:line-through;opacity:.5}
.li .w{font:500 19px/1.3 var(--ui),var(--jp)}.li .r{color:var(--ac2);font-size:14px}.li .m{color:var(--mu);font-size:14px}
.li .unit{font-size:11px;font-weight:600;color:var(--mu);background:var(--bg2);border-radius:6px;padding:1px 6px}
.li button{border:0;background:none;color:var(--ko);font-size:18px;cursor:pointer;border-radius:8px}
.li button:hover{background:var(--bg2)}
.li button.star{color:var(--mu);font-size:20px;min-width:32px;padding:2px}.li button.star.fav-on{color:#e0a526}.li button.star:hover{color:#e0a526}.li button[title="Rimuovi"],.li button[title="Ripristina"]{min-width:30px}
/* quiz */
.opt{display:block;width:100%;margin:8px 0;text-align:left;padding:13px 16px;font-size:17px;white-space:normal}.opt.ok,.opt.ko{color:#fff}
/* ===== Home ===== */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 16px}
.hero h2{margin:0;font-size:26px;letter-spacing:-.02em}.hero p{margin:4px 0 0;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,transform .12s;text-align:left;font:inherit;color:inherit}
.stat:hover{border-color:var(--ac);transform:translateY(-1px)}
.stat .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--ac-soft);color:var(--ac);font:700 18px/1 var(--jp)}
.stat .ttl{font-weight:600}.stat .num{font-size:26px;font-weight:700;letter-spacing:-.02em}.stat .num small{font-size:14px;color:var(--mu);font-weight:500}
.stat .bar{margin:2px 0 0}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--ac2-soft);border:1px solid color-mix(in srgb,var(--ac2) 25%,var(--bd));color:var(--tx);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-size:14px}
.tip b{color:var(--ac2)}
.unit-table{width:100%;border-collapse:collapse;font-size:14px}
.unit-table th,.unit-table td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left}
.unit-table th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.unit-table td.n{font-variant-numeric:tabular-nums}
.mini-bar{height:6px;background:var(--bd);border-radius:99px;overflow:hidden;min-width:60px}.mini-bar i{display:block;height:100%;background:var(--ac2)}
/* ===== Esercizi ===== */
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.ex-title{font-size:22px;font-weight:700;letter-spacing:-.01em}.ex-sub{color:var(--mu);font-size:13px}
.ex-prompt{font-size:20px;line-height:1.85;white-space:pre-line;padding:20px 4px 8px;margin-bottom:12px}
.ex-instr{font:600 14px/1.5 var(--ui);color:var(--mu);margin-bottom:8px;white-space:normal}
.ex-answer{font:inherit;font-size:18px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;width:100%;min-height:54px}.ex-answer:focus{border-color:var(--ac2);outline:none;box-shadow:0 0 0 3px var(--ac2-soft)}
.ex-inline-blank{display:inline-block;width:4.5em;min-width:3.5em;margin:0 3px;padding:3px 6px;border:1.5px solid var(--ac);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:.92em;line-height:1.4;text-align:center;vertical-align:baseline}.ex-inline-blank:focus{outline:2px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:1px}
.ex-tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;align-items:center}
.ex-tiles .btn{font-size:18px;padding:9px 14px}
.ex-choices{display:grid;gap:8px}
.ex-choice{padding:14px 16px;font-size:18px;white-space:normal;min-height:52px;justify-content:flex-start;text-align:left}
.ex-feedback{padding:16px;border-left:4px solid var(--ac2);line-height:1.7}
.ex-feedback b{font-size:17px}.ex-count{font-variant-numeric:tabular-nums}
.ex-type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0;align-items:start}
.ex-type{display:flex;align-items:center;gap:10px;text-align:left;white-space:normal;padding:12px 14px;min-height:58px;width:100%;justify-content:flex-start}
.ex-type input{accent-color:var(--ac);width:18px;height:18px;flex:none}
.ex-type span{flex:1}.ex-type small{font-weight:600;color:var(--ac);font-size:12px}
.ex-level-select{width:100%;margin-top:7px;font-size:13px;padding:8px 10px;background:var(--card);color:var(--tx)}.ex-type-card{min-width:0;display:flex;flex-direction:column;gap:4px}
.jp-answer{font-size:22px;line-height:1.7;margin-top:5px}
.answer-romaji{margin:7px 0}.answer-romaji summary{cursor:pointer;list-style:none;color:var(--ac);font-weight:600}.answer-romaji summary::-webkit-details-marker{display:none}.answer-romaji summary:before{content:"▸";display:inline-block;margin-right:7px;transition:transform .15s}.answer-romaji[open] summary:before{transform:rotate(90deg)}.answer-romaji div{margin:5px 0 0 18px;color:var(--mu);font-size:14px}
/* ===== Grammatica ===== */
.gr-rule{padding:18px 20px}.gr-rule h3{margin:8px 0 6px;font-size:19px;letter-spacing:-.01em}.gr-explain{margin:7px 0;line-height:1.7}
.gr-model{margin-top:12px;padding:12px 14px;background:var(--bg2);border-left:3px solid var(--ac);border-radius:0 10px 10px 0;line-height:1.7;color:var(--tx);font-size:15px}.gr-model .gr-translation{color:var(--mu);font-weight:500}.gr-model b{color:var(--tx)}.gr-translation{color:var(--tx);font-weight:500}
.gr-more{margin-top:10px;border-top:1px solid var(--bd);padding-top:9px}.gr-more summary{cursor:pointer;list-style:none;color:var(--ac);font-weight:600;user-select:none}.gr-more summary::-webkit-details-marker{display:none}.gr-more summary:before{content:"▸";display:inline-block;margin-right:8px;transition:transform .15s}.gr-more[open] summary:before{transform:rotate(90deg)}
.gr-examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}.gr-example{padding:11px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px}.jp-example{font-size:19px;margin-bottom:4px}
.gr-toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.gr-toc a{font-size:13px;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 11px}
.gr-toc a:hover{border-color:var(--ac);color:var(--ac)}
.gr-unit{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:22px 0 10px}
.day-scheme{margin:12px 0;padding:14px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px}.day-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:7px;margin:9px 0}.day-cell{display:flex;flex-direction:column;gap:2px;padding:9px;background:var(--card);border:1px solid var(--bd);border-radius:9px}.day-cell b{font:700 17px/1.3 var(--ui),var(--jp)}.day-cell span{font-size:16px;font-weight:600}.day-cell small{color:var(--mu)}.day-scheme p{margin:8px 0 0;line-height:1.5}
.counter-key{display:flex;flex-wrap:wrap;align-items:center;gap:7px 16px;margin:9px 0 12px;color:var(--mu);font-size:12px}.counter-key-mark{display:inline-flex;align-items:center;gap:6px}.counter-key-swatch{display:inline-block;width:12px;height:12px;border:1px solid var(--ac);border-radius:3px;background:var(--ac-soft)}.day-cell.counter-changed{border-color:var(--ac);background:var(--ac-soft)}.counter-change-label{display:block;margin-top:4px;color:var(--ac);font-size:10px;font-style:normal;font-weight:700;line-height:1.2}
@media(hover:none){.kbd-hint{display:none!important}}
/* ===== Telefono ===== */
@media(max-width:720px){
 .app{padding:0 14px calc(92px + env(safe-area-inset-bottom,0px))}
 .brand-title{font-size:16px}.logo{width:38px;height:38px;font-size:20px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px}.stat .num{font-size:22px}

 .tab{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:6px 0;font-size:9.5px;letter-spacing:-.02em;border-radius:10px;overflow:hidden}

 .units-soon{display:none}
 .ex-start{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25)}
 .ex-type{min-height:46px;padding:9px 12px}.ex-type-grid{gap:7px}

<header class="top"><div class="brand"><div class="logo" aria-hidden="true">語</div><div><div class="brand-title">Impariamo il giapponese</div><div class="brand-sub" id="brand-sub">Volume 1 · studio personale</div></div></div><button class="icon-btn" onclick="th()" title="Tema chiaro / scuro" aria-label="Cambia tema">◐</button></header>

<script>
// ===== DATI (per aggiungere un’unità basta aggiungere righe qui) =====
// ===== REGOLA (vale per ogni nuova unità) =====
// Vocaboli (V) e Kanji lettura (KR) contengono ESCLUSIVAMENTE le parole delle sezioni lessico del libro
// (会話の語い, 練習問題の語い, 読解の語い).
// · V  = parole senza kanji, solo hiragana (le parole solo in katakana restano fuori).

const G=[[1,"です (copula)","Il predicato nominale è un nome + です, che vale “essere”. Con か finale diventa domanda.","私のいぬは12キロです。 Watashi no inu wa 12 kiro desu. “Il mio cane pesa 12 chili.”"],[1,"の (specificazione)","Lega due nomi: il primo specifica o modifica il secondo, che viene dopo.","日本語の学生 nihongo no gakusei = studente di lingua giapponese"],[1,"方 kata / 人 jin","Entrambi = “persona”. 方 è più formale (2ª e 3ª persona) e si lega con の; 人 è meno formale e si attacca al nome (日本人).","日本の方 nihon no kata · 日本人 nihonjin"],[1,"は (tema)","La particella は (si legge “wa”) evidenzia il tema/soggetto della frase.","かわぐちさんは学生です。"],[1,"さん","Suffisso dopo il nome della 2ª e 3ª persona, mai della 1ª.","山下さん Yamashita-san"],[1,"Negazione di です","ではありません dewaarimasen oppure じゃありません jaarimasen. Non cambia con numero o genere.","かわぐちさんは山下さんのともだちじゃありません。"],[1,"そうですか","“Davvero?”, “Ah sì?”: mostra che hai capito e che sei interessato alla conversazione.","そうですか。Sō desu ka."],[1,"か (domanda)","Quando です è seguito dalla particella finale か, la frase diventa una domanda.","あなたはかいしゃいんですか。 “È un impiegato?”"],[1,"ええ","Usato nelle risposte affermative, più colloquiale di はい. Come そうですか, mostra anche interesse nella conversazione.","ええ、そうです。"],[1,"へえ","Esclamazione informale che sottolinea stupore.","へえ hē"],[1,"何 nan / nani","Pronome interrogativo “che cosa?”. Quando 何 compare nella frase, questa termina con か.","あなたのしゅみは何ですか。"],[1,"も (anche)","Particella enfatica che significa “anche”, riferita al sostantivo che la precede.","マリアさんもアラビア語の学生です。 “Anche Maria è una studentessa di arabo.”"],[1,"と (e)","Tra due sostantivi equivale alla congiunzione “e”.","わたしのしゅみはえいがとおんがくです。 “I miei hobby sono il cinema e la musica.”"],[1,"Omissione del predicato","Se l’argomento è chiaro, si può lasciare solo il soggetto e dire la frase con intonazione ascendente, come una domanda.","お名前は？ Onamae wa? “Il suo nome?”"],
[2,"Dimostrativi: これ・それ・あれ","I pronomi dimostrativi indicano una persona o una cosa senza nominarla: これ (vicino a chi parla), それ (vicino a chi ascolta), あれ (lontano da entrambi). Non cambiano per genere o numero.","これは何ですか。 Kore wa nan desu ka. “Che cos’è questo?”"],
[2,"Dimostrativi: この・その・あの","Queste forme accompagnano sempre un nome: この本 = questo libro; その本 = quel libro vicino a chi ascolta; あの建物 = quell’edificio laggiù. Non usarle da sole.","この本は日本語の本です。 Kono hon wa nihongo no hon desu."],
[2,"誰・誰の (chi / di chi)","誰 (dare) significa “chi?”. Con の diventa 誰の (dare no), “di chi?”. La particella の si usa come nell’Unità 1 per indicare possesso o specificazione.","これは誰の本ですか。 Kore wa dare no hon desu ka. “Di chi è questo libro?”"],
[2,"Omissione del nome già noto","Se dal contesto è chiaro il nome sottinteso, dopo の si può omettere. La regola riprende l’omissione del predicato vista nell’Unità 1.","それはエレナさんの（本）です。 Sore wa Erena-san no (hon) desu."],
[2,"Mesi: numero + 月","Per i mesi si usa il numero di origine cinese seguito da 月 (がつ, gatsu): 一月 ichigatsu (gennaio), 二月 nigatsu (febbraio), 九月 kugatsu (settembre). 何月 (なんがつ, nangatsu) significa “quale mese?”.","誕生日は何月ですか。 Tanjōbi wa nangatsu desu ka."],
[2,"Giorni del mese","I primi dieci giorni hanno letture irregolari: 一日ついたち, 二日ふつか, 三日みっか, 四日よっか, 五日いつか, 六日むいか, 七日なのか, 八日ようか, 九日ここのか, 十日とおか. Attenzione anche a 十四日じゅうよっか, 二十日はつか e 二十四日にじゅうよっか.","誕生日は五月二十日です。 Tanjōbi wa gogatsu hatsuka desu."],
[2,"Compleanno: いつ","いつ (itsu) significa “quando?”. Per chiedere la data si può usare 誕生日はいつですか. Per precisare mese e giorno si usano i contatori 月 e 日. Al posto di いつ si può chiedere direttamente mese e giorno con 何月何日 (nangatsu nannichi): 誕生日は何月何日ですか。","モリさんの誕生日はいつですか。 Mori-san no tanjōbi wa itsu desu ka."],
[2,"Prefisso cortese お (お誕生日)","Mettendo il prefisso お (o) davanti a un sostantivo, l’espressione diventa più formale e gentile: 誕生日 → お誕生日. Si usa parlando delle cose dell’interlocutore, non delle proprie.","森さんのお誕生日はいつですか。 Mori-san no otanjōbi wa itsu desu ka."],
[2,"何の: di che cosa? che tipo di?","何の (nan no) + nome chiede il contenuto o il tipo di qualcosa, mentre 誰の chiede il proprietario. それは何の本ですか → “Di che cosa parla quel libro?”; これは誰の本ですか → “Di chi è questo libro?”.","それは何の本ですか。 Sore wa nan no hon desu ka."],
[2,"Due serie di numeri","Esistono due serie numeriche: una di origine cinese (いち, に, さん…) e una di origine giapponese (ひと, ふた, み…). Si sceglie la serie in base al classificatore: i mesi usano la serie cinese, i primi dieci giorni del mese quella giapponese.","一月 ichigatsu · 二日 futsuka"],
[2,"Età: ～才・何才","才 (さい, sai) è il contatore degli anni di età; 何才 (なんさい, nansai) chiede “quanti anni?”. La forma tradizionale per vent’anni è はたち (二十才). Alcuni numeri cambiano pronuncia davanti a sai: いっさい, はっさい, はたち. Il libro scrive l’età con 才 (さい).","モリさんは二十一才です。 Mori-san wa nijūissai desu."],
[2,"Numeri di telefono","Per leggere un numero di telefono si pronunciano le cifre una per una, senza un contatore. 何番 (なんばん, nanban) chiede “quale numero?”. La struttura delle domande con ですか riprende l’Unità 1.","電話番号は何番ですか。 Denwa bangō wa nanban desu ka."],
[2,"Ripasso: は・です・か insieme ai dimostrativi","Per fare una domanda con un dimostrativo, conserva la struttura già studiata: tema + は + nome/predicato + です + か. の può aggiungere una specificazione o indicare il proprietario.","あの建物は美術館ですか。 Ano tatemono wa bijutsukan desu ka."],
[3,"どこ・どこの: chiedere dove","どこ (doko) è l’interrogativo “dove?”. どこの + nome chiede “di quale luogo?”. La struttura riprende は, の e です già studiati.","レストランはどこですか。 Resutoran wa doko desu ka."],
[3,"おいしい: l’aggettivo prima del nome","おいしい (oishii) significa “buono, delizioso” ed è un aggettivo in い. In questa unità si osserva che l’aggettivo precede il nome; la coniugazione si affronta nell’Unità 7.","おいしい日本料理。 Oishii Nihon ryōri."],
[3,"ええと: prendere tempo mentre si pensa","ええと (ēto) è un’espressione usata durante una pausa, mentre si pensa a cosa rispondere: “dunque…”, “vediamo…”.","ええと、本を二冊とCDを七枚。 Ēto, hon o ni-satsu to CD o nanamai."],
[3,"Questo posto e laggiù: ここ・そこ・あそこ","ここ indica un luogo vicino a chi parla, そこ un luogo vicino a chi ascolta e あそこ un luogo lontano da entrambi. Per accompagnare un nome si riprendono le forme già studiate この・その・あの. Nel dialogo compare anche この近く, “qui vicino”.","本屋さんはあそこです。 Honya-san wa asoko desu."],
[3,"Piani: ～階・何階","階 (かい, kai) è il classificatore per i piani di un edificio. Si combina con il numero; il libro richiama la variazione fonetica di 三階 (さんがい, sangai). Per chiedere il piano si usa 何階 (なんがい, nangai).","あのレストランは二階です。 Ano resutoran wa nikai desu."],
[3,"Libri e volumi: ～冊","冊 (さつ, satsu) è il classificatore usato per contare libri e quaderni. Si mette dopo il numero: 二冊, 三冊. Anche qui alcune combinazioni cambiano suono, come mostrato nello schema.","本を二冊とノートを三冊ください。 Hon o ni-satsu to nōto o san-satsu kudasai."],
[3,"Oggetti piatti e sottili: ～枚","枚 (まい, mai) è il classificatore per oggetti piatti e sottili, come francobolli e cartoline. Il numero precede 枚; le letture nello schema mostrano la forma regolare.","切手を五枚ください。 Kitte o go-mai kudasai."],
[3,"Oggetti cilindrici: ～本","本 (ほん, hon) si usa per contare oggetti lunghi o cilindrici. Il suono cambia in alcune combinazioni: nel libro compare 六本, letto ろっぽん; per chiedere “quanti?” si usa 何本, letto なんぼん.","やきとりを三本ください。 Yakitori o san-bon kudasai."],
[3,"Chiedere il prezzo: いくら","いくら (ikura) è l’interrogativo usato per chiedere il prezzo: nome は いくらですか. Per rispondere si dice l’importo e poi la valuta. Euro, dollari e yen indicano già l’unità monetaria, quindi non richiedono un altro classificatore.","これはいくらですか。 Kore wa ikura desu ka."],
[3,"は come tema: “per quanto mi riguarda”","Nella frase 私はさしみランチ, は introduce il tema “per quanto mi riguarda”. In questo uso non presenta 私 come soggetto grammaticale di un predicato: specifica a chi si riferisce l’ordine.","私はさしみランチ。 Watashi wa sashimi ranchi."] ,
[3,"Orari: ～時・半・何時","時 (じ, ji) è il classificatore per le ore. La serie usa i numeri di origine cinese, con due forme da memorizzare: 4時 si legge よじ (yoji) e 9時 si legge くじ (kuji), come spiega il libro. 半 (はん, han) aggiunge “e mezza”; 何時 (なんじ, nanji) chiede l’ora.","今、二時半です。 Ima, ni-ji han desu."],
[3,"Richieste: ～をください","Per ordinare o chiedere un oggetto si usa nome + をください (o kudasai). を marca ciò che si chiede; ください rende la richiesta cortese. Si possono collegare più oggetti con と.","やきとりランチをください。 Yakitori ranchi o kudasai."],
[3,"La particella finale よ","よ (yo) si usa a fine frase per enfatizzare quanto si sta dicendo.","この近くですよ。 Kono chikaku desu yo."],
[3,"La particella finale ね","ね (ne) si usa a fine frase per condividere l’affermazione con l’interlocutore e cercarne la partecipazione.","本屋さんがいいですね。 Honya-san ga ii desu ne."],
[4,"どこ con あります・います","Nell’Unità 3 どこ si usava con です. Ora si usa anche con i verbi あります e います per chiedere dove si trova qualcosa o qualcuno.","不動産屋はどこにありますか。 Fudōsanya wa doko ni arimasu ka."],
[4,"あります・います: esserci","あります (arimasu) e います (imasu) significano “esserci” ed esprimono esistenza e presenza: あります per le cose inanimate, います per gli esseri viventi. Schema: luogo + に + soggetto + が + あります/います. Se il soggetto non è l’informazione nuova si usa は: soggetto + は + luogo + に + あります/います; in questo caso l’informazione importante è il luogo.","大学に学生がおおぜいいます。 Daigaku ni gakusei ga ōzei imasu."],
[4,"L’ausiliare -ます: presente e passato","Con あります e います si impara l’ausiliare -masu, che servirà per tutti i verbi dell’Unità 5. Presente (non passato): -ます (affermativo), -ません (negativo). Passato: -ました (affermativo), -ませんでした (negativo).","あります · ありません · ありました · ありませんでした"],
[4,"Indicare la posizione: luogo + の + 上・下・中…","Per precisare dove si trova qualcosa si usa: luogo + の + indicazione di posizione. Indicazioni: 上 ue (sopra), 下 shita (sotto), 左 hidari (sinistra), 右 migi (destra), 中 naka (dentro), 外 soto (fuori), 前 mae (davanti), 近く chikaku (vicino), 横 yoko (di fianco), 間 aida (tra).","かばんの中 kaban no naka “dentro la borsa” · つくえの上 tsukue no ue “sopra la scrivania”"],
[4,"何か・誰か・どこか (indefiniti)","Gli interrogativi 何, 誰, どこ seguiti da か diventano indefiniti: 何か “qualcosa”, 誰か “qualcuno”, どこか “da qualche parte”. Alla risposta negativa si usa 何も + negativo: 何もありません “non c’è nulla”.","いすの下に何かありますか。 Isu no shita ni nani ka arimasu ka."],
[4,"や: elenco non completo","と unisce i nomi quando l’elenco è completo. Se invece si citano solo alcuni esempi si usa や (ya), spesso con など alla fine (“ecc.”).","大学の前や駅の近くなどにあります。 Daigaku no mae ya eki no chikaku nado ni arimasu."],
[4,"その: riferimento a ciò di cui si è parlato","その può non indicare la posizione, ma riferirsi a qualcosa già nominato nel discorso: その不動産屋 = “quell’agenzia (di cui abbiamo parlato)”.","その不動産屋に友だちがいます。 Sono fudōsanya ni tomodachi ga imasu."],
[4,"I giorni della settimana","I giorni si formano con un kanji + 曜日 (yōbi). Per chiedere il giorno si usa 何曜日 (nanyōbi).","今日は金曜日です。 Kyō wa kinyōbi desu."],
[4,"から・まで: da… a…","から (kara) indica il punto di partenza, まで (made) il punto di arrivo, nel tempo e nello spazio. In questa unità si usano per gli orari.","試験は何時からですか。 Shiken wa nanji kara desu ka."],
[4,"Durata: ～時間","Per indicare la durata si aggiunge 間 (kan) alle ore: 2時間 (nijikan) = “per due ore / due ore”.","お昼の2時間は休みですね。 Ohiru no nijikan wa yasumi desu ne."],
[4,"Contare oggetti: ～つ","Il classificatore つ (tsu) conta gli oggetti senza specificarne il tipo. Usa la serie numerica giapponese fino a dieci; per chiedere quanti si usa いくつ (ikutsu).","二つあります。 Futatsu arimasu."],
[5,"I verbi in -ます","Da questa unità tutti i verbi, come あります e います dell’Unità 4, terminano con l’ausiliare -ます nel presente/non passato e nel passato, affermativo e negativo. Ogni verbo è preceduto da una particella scelta in base al tipo di verbo e alla situazione.","行きます · 行きません · 行きました · 行きませんでした"],
[5,"を: complemento oggetto","La particella を (si legge o) marca il complemento oggetto dei verbi transitivi. Finora abbiamo visto は, か, の, も, と (Unità 1), を (Unità 3), が, から, まで (Unità 4).","A：何をしますか。B：カーニバルのパーティをします。 Nani o shimasu ka. Kānibaru no pāti o shimasu."],
[5,"特別: un altro tipo di aggettivo","特別 (tokubetsu) “speciale, particolare” è un aggettivo di tipo diverso da おいしい (Unità 3): davanti al nome prende な (特別な服). I gruppi di aggettivi si studiano nell’Unità 7.","特別な服を着ます。 Tokubetsu na fuku o kimasu."],
[5,"へ: moto a luogo","La particella へ (scritta con il segno hiragana “he” ma letta e) indica la direzione del movimento e segue il luogo verso cui si va.","日本へ行きました。 Nihon e ikimashita."],
[5,"Invitare: ～ませんか","Il negativo interrogativo del verbo si usa per invitare qualcuno a fare qualcosa: “non andiamo…?”, “ti andrebbe di…?”.","いっしょに映画を見ませんか。 Issho ni eiga o mimasen ka."],
[5,"Proporre e accettare: ～ましょう","L’ausiliare -ましょう serve per coinvolgere l’interlocutore, condividere una proposta o accettare un invito: “facciamo…!”. In forma di domanda (～ましょうか) chiede un parere.","A：今晩フランス料理を食べませんか。B：いいですね。食べましょう。"],
[5,"にします: scegliere","Il verbo します con に indica una scelta: “prendo, scelgo…”.","このかばんにします。 Kono kaban ni shimasu."],
[5,"の che collega una descrizione","の può collegare al nome una parte che lo descrive, come una frase relativa: 友だちのエレナさん = “Elena, che è mia amica”.","日本人の友だちです。 Nihonjin no tomodachi desu."],
[5,"どちら","どちら (dochira) equivale a どこ “dove?” (Unità 4), ma è più formale.","どちらですか。 Dochira desu ka."],
[5,"で: mezzo","Con i verbi di movimento, で (de) indica il mezzo con cui ci si sposta.","電車で行きます。 Densha de ikimasu."],
[5,"かかります: quanto tempo ci vuole","かかります dopo un’indicazione di tempo esprime il tempo necessario per un’azione. Le ore sono seguite da 間 (kan), che indica la durata: 2時間 “due ore / per due ore”. Per chiedere si usa どのくらい.","ローマからボルツァーノまで電車で4時間半くらいかかります。"],
[5,"に: momento preciso","に (ni) dopo un’espressione di tempo indica il momento esatto in cui avviene l’azione.","A：火曜日に帰りますか。B：いいえ。木曜日に帰ります。"],
[5,"に e へ con i verbi di movimento","Prima di un verbo di movimento に ha la stessa funzione di へ: に sottolinea la destinazione, へ la direzione.","京都に行きます。 · 京都へ行きます。"],
[5,"が e は: dove cade l’attenzione","が marca il soggetto quando è l’informazione nuova o importante: 誰が話しましたか, l’interesse è sul “chi”. Con は l’interesse è su ciò che viene dopo: ファビオさんはどこにいますか, l’interesse è sul “dove”.","誰が話しましたか。 Dare ga hanashimashita ka."],
[5,"も + negativo: niente, da nessuna parte","も, da sola o dopo un’altra particella, con il verbo negativo esprime “niente, nessuno, da nessuna parte”: 何も, どこにも.","どこにも行きません。 · 何も食べませんでした。"],
[5,"から: perché","から alla fine della frase, dopo il verbo, la rende causale: “perché…”.","どこにも行きません。日本から友だちが来ますから。"]

 el(toc+rules.map(([g,gi])=>{const head=g[0]!==lastU?`<div class="gr-unit">Unità ${g[0]}</div>`:"";lastU=g[0];return head+(()=>{

  const schemeHtml=scheme?`<div class="day-scheme counter-scheme"><b>${scheme.title}</b><div class="counter-key"><span class="counter-key-mark"><i class="counter-key-swatch"></i> Variazione fonetica / lettura speciale</span><span>Non evidenziato = numero + classificatore regolari.</span></div><div class="day-grid">${scheme.rows.map(d=>{const changed=(scheme.changed||[]).includes(d[0]);return `<div class="day-cell${changed?" counter-changed":""}"><b>${d[0]}</b><span>${d[1]}</span><small>${d[2]}</small>${changed?`<em class="counter-change-label">variazione</em>`:""}</div>`}).join("")}</div><p class="mu">${scheme.note}</p></div>`:"";
  return `<article class="g gr-rule" id="gr-${gi}"><span class="tag">Unità ${g[0]}</span><h3>${g[1]}</h3><p class="gr-explain">${g[2]}</p>${dayHtml}${schemeHtml}<div class="mu gr-model"><b>Esempio:</b> <span class="jp-example" style="font-size:18px">${g[3]}</span> <span class="gr-translation">${G_TR[key]?`— ${G_TR[key]}`:""}</span></div>${demos.length?`<details class="gr-more"><summary>Mostra altri esempi</summary><div class="gr-examples">${demos.map(d=>`<div class="gr-example"><div class="jp-example">${d[0]}</div><div class="mu">${d[1]}</div><div class="gr-translation">${d[2]}</div></div>`).join("")}</div></details>`:""}</article>`
