<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impariamo il giapponese – Studio</title>
<meta name="theme-color" content="#c2412d">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== Design system ===== */
:root{--bg:#f6f3ec;--bg2:#efeadf;--card:#fffdf9;--tx:#1c1f26;--mu:#6b6f78;--ac:#c2412d;--ac-soft:#f6e1da;--ac2:#2f5d8a;--ac2-soft:#e2ebf4;--bd:#e4ddd0;--ok:#2f7d4f;--ok-soft:#dcefe2;--ko:#b3362b;--ko-soft:#f6dcd8;--shadow:0 1px 2px rgba(28,31,38,.05),0 6px 20px rgba(28,31,38,.06);--r:14px;--jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;--jps:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;--ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--bg2:#181b21;--card:#1d2027;--tx:#eceef2;--mu:#9aa0ab;--ac:#f07a63;--ac-soft:#3a2420;--ac2:#7fb0e0;--ac2-soft:#1e2a38;--bd:#2c313b;--ok:#5cc489;--ok-soft:#183325;--ko:#f07a6e;--ko-soft:#3a1f1d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--bg2:#181b21;--card:#1d2027;--tx:#eceef2;--mu:#9aa0ab;--ac:#f07a63;--ac-soft:#3a2420;--ac2:#7fb0e0;--ac2-soft:#1e2a38;--bd:#2c313b;--ok:#5cc489;--ok-soft:#183325;--ko:#f07a6e;--ko-soft:#3a1f1d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:120px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--ui);font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
:lang(ja),.big,.mid,.jp-example,.jp-answer,.ex-prompt,.ex-choice,.ex-tiles .btn,.day-cell,.li span,.kanji-hints{font-family:var(--ui),var(--jp)}
button{font-family:inherit}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
/* ===== Struttura ===== */
.app{max-width:980px;margin:0 auto;padding:0 20px 40px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--ac);color:#fff;font:700 23px/1 var(--jps);box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 35%,transparent);flex:none}
.brand-title{font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{color:var(--mu);font-size:13px;line-height:1.3}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;cursor:pointer}
.icon-btn:hover{border-color:var(--ac2)}
/* tabs */
.tabs{display:flex;gap:4px;padding:4px;margin:2px 0 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--mu);padding:9px 9px;border-radius:10px;font:500 13.5px/1.2 var(--ui);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab i{font-style:normal;font:700 15px/1 var(--jp);opacity:.85}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--card);color:var(--ac);box-shadow:var(--shadow)}
.tab .short{display:none}
/* barra unità */
.units{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.units-label{font-size:13px;font-weight:600;color:var(--mu);margin-right:4px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 13px;border-radius:999px;font:500 14px/1.2 var(--ui);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.units-soon{font-size:12px;color:var(--mu);margin-left:4px}
#v{min-height:50vh}
/* ===== Componenti di base ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px;border-radius:12px;font:500 15px/1.25 var(--ui);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd))}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.btn.ok:hover,.btn.ko:hover,.btn.on:hover{filter:brightness(1.05)}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1;font-weight:600}
.g{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.g b{color:var(--ac)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--ac2);background:var(--ac2-soft);padding:2px 9px;border-radius:999px}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),color-mix(in srgb,var(--ac2) 60%,var(--ok)));border-radius:99px;transition:width .3s}
.big{font:700 64px/1.15 var(--jps)}.mid{font:500 30px/1.35 var(--ui),var(--jp)}
.card>.mid:first-child{font-size:40px;font-weight:700}
.card .rd{color:var(--ac);font:500 20px/1.4 var(--ui),var(--jp)}.card .mean{font-size:20px;font-weight:500;max-width:32ch}
@media(max-width:900px) and (min-width:721px){.tab i{display:none}}
/* toolbar delle carte */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.seg{display:inline-flex;padding:3px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px}
.seg .btn{border:0;background:transparent;padding:8px 14px;border-radius:9px;color:var(--mu)}
.seg .btn.on{background:var(--card);color:var(--ac);box-shadow:var(--shadow)}
.toolbar .tool{padding:8px 12px;font-size:14px;border-radius:10px}
.toolbar .tool.on{background:var(--ac-soft);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.toolbar .spacer{flex:1}
/* flashcard */
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:30px 24px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.card:hover{box-shadow:0 2px 4px rgba(0,0,0,.06),0 14px 34px rgba(28,31,38,.1)}
.card .mid:first-child,.card .big:first-child{margin-top:4px}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mu);margin-bottom:6px}
.flip-hint{margin-top:8px;font-size:12px;color:var(--mu)}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;font:600 11px/1.4 var(--ui);color:var(--mu);background:var(--bg2)}
.kanji-pad-wrap{width:min(100%,420px);margin:8px auto 0;text-align:left}.kanji-pad{display:block;width:100%;height:200px;border:1px dashed var(--bd);border-radius:12px;background:var(--bg);touch-action:none;cursor:crosshair}.kanji-pad-label{font-size:13px;color:var(--mu);margin-bottom:5px}.kanji-hints{font-size:18px;line-height:1.7;display:flex;gap:22px;flex-wrap:wrap;justify-content:center}.kanji-clue{font-size:22px;font-weight:600}.kanji-pad-clear{margin-top:7px;padding:7px 10px;font-size:14px}.kanji-drawing-preview{display:block;width:min(100%,420px);height:150px;margin:10px auto 0;border:1px solid var(--bd);border-radius:12px;object-fit:contain;background:var(--bg)}.stroke-order-wrap{width:min(100%,320px);margin:10px auto 0}.stroke-order-svg{display:block;width:100%;height:auto;max-height:300px;background:var(--bg);border:1px solid var(--bd);border-radius:12px}.stroke-order-status{text-align:center;color:var(--mu);font-size:13px;margin:5px 0}.stroke-order-credit{text-align:center;color:var(--mu);font-size:11px;margin-top:5px}
/* elenco */
.list{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0}.li span{flex:1}.li.rm span{text-decoration:line-through;opacity:.5}
.li .w{font:500 19px/1.3 var(--ui),var(--jp)}.li .r{color:var(--ac2);font-size:14px}.li .m{color:var(--mu);font-size:14px}
.li .unit{font-size:11px;font-weight:600;color:var(--mu);background:var(--bg2);border-radius:6px;padding:1px 6px}
.li button{border:0;background:none;color:var(--ko);font-size:18px;cursor:pointer;border-radius:8px}
.li button:hover{background:var(--bg2)}
.li button.star{color:var(--mu);font-size:20px;min-width:32px;padding:2px}.li button.star.fav-on{color:#e0a526}.li button.star:hover{color:#e0a526}.li button[title="Rimuovi"],.li button[title="Ripristina"]{min-width:30px}
/* quiz */
.opt{display:block;width:100%;margin:8px 0;text-align:left;padding:13px 16px;font-size:17px;white-space:normal}.opt.ok,.opt.ko{color:#fff}
/* ===== Home ===== */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:4px 0 16px}
.hero h2{margin:0;font-size:26px;letter-spacing:-.02em}.hero p{margin:4px 0 0;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,transform .12s;text-align:left;font:inherit;color:inherit}
.stat:hover{border-color:var(--ac);transform:translateY(-1px)}
.stat .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--ac-soft);color:var(--ac);font:700 18px/1 var(--jp)}
.stat .ttl{font-weight:600}.stat .num{font-size:26px;font-weight:700;letter-spacing:-.02em}.stat .num small{font-size:14px;color:var(--mu);font-weight:500}
.stat .bar{margin:2px 0 0}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--ac2-soft);border:1px solid color-mix(in srgb,var(--ac2) 25%,var(--bd));color:var(--tx);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-size:14px}
.tip b{color:var(--ac2)}
.unit-table{width:100%;border-collapse:collapse;font-size:14px}
.unit-table th,.unit-table td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left}
.unit-table th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.unit-table td.n{font-variant-numeric:tabular-nums}
.mini-bar{height:6px;background:var(--bd);border-radius:99px;overflow:hidden;min-width:60px}.mini-bar i{display:block;height:100%;background:var(--ac2)}
/* ===== Esercizi ===== */
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.ex-title{font-size:22px;font-weight:700;letter-spacing:-.01em}.ex-sub{color:var(--mu);font-size:13px}
.ex-prompt{font-size:20px;line-height:1.85;white-space:pre-line;padding:20px 4px 8px;margin-bottom:12px}
.ex-instr{font:600 14px/1.5 var(--ui);color:var(--mu);margin-bottom:8px;white-space:normal}
.ex-hint{display:inline-block;margin-top:6px;font:italic 500 15px/1.5 var(--ui);color:var(--ac2)}
.ex-tr-btn{display:inline-flex;align-items:center;gap:6px;margin:4px 0 8px;padding:5px 11px;border:1px solid var(--bd);border-radius:999px;background:var(--bg2);color:var(--ac2);font:600 13px/1.2 var(--ui);cursor:pointer}.ex-tr-btn:hover{border-color:var(--ac2)}.ex-tr-btn[aria-expanded="true"]{background:var(--ac2-soft);border-color:var(--ac2)}
.ex-tr{margin:0 0 12px;padding:10px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;display:grid;gap:10px}.tr-row{display:grid;gap:2px}.tr-jp{font:500 16px/1.5 var(--jp);display:flex;gap:8px;align-items:flex-start}.tr-jp button{flex:none;border:0;background:none;cursor:pointer;font-size:15px;padding:0 2px;line-height:1.5}.tr-ro{font:italic 14px/1.45 var(--ui);color:var(--mu)}.tr-it{font:500 14px/1.45 var(--ui);color:var(--tx)}.tr-none{font-size:13px;color:var(--mu)}
.ex-answer{font:inherit;font-size:18px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;width:100%;min-height:54px}.ex-answer:focus{border-color:var(--ac2);outline:none;box-shadow:0 0 0 3px var(--ac2-soft)}
.ex-inline-blank{display:inline-block;width:4.5em;min-width:3.5em;margin:0 3px;padding:3px 6px;border:1.5px solid var(--ac);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:.92em;line-height:1.4;text-align:center;vertical-align:baseline}.ex-inline-blank:focus{outline:2px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:1px}
.ex-tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;align-items:center}
.ex-tiles .btn{font-size:18px;padding:9px 14px}
.ex-choices{display:grid;gap:8px}
.ex-choice{padding:14px 16px;font-size:18px;white-space:normal;min-height:52px;justify-content:flex-start;text-align:left}
.ex-feedback{padding:16px;border-left:4px solid var(--ac2);line-height:1.7}
.ex-feedback b{font-size:17px}.ex-count{font-variant-numeric:tabular-nums}
.ex-type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0;align-items:start}
.ex-type{display:flex;align-items:center;gap:10px;text-align:left;white-space:normal;padding:12px 14px;min-height:58px;width:100%;justify-content:flex-start}
.ex-type input{accent-color:var(--ac);width:18px;height:18px;flex:none}
.ex-type span{flex:1}.ex-type small{font-weight:600;color:var(--ac);font-size:12px}
.ex-level-select{width:100%;margin-top:7px;font-size:13px;padding:8px 10px;background:var(--card);color:var(--tx)}.ex-type-card{min-width:0;display:flex;flex-direction:column;gap:4px}
.jp-answer{font-size:22px;line-height:1.7;margin-top:5px}
.answer-romaji{margin:7px 0}.answer-romaji summary{cursor:pointer;list-style:none;color:var(--ac);font-weight:600}.answer-romaji summary::-webkit-details-marker{display:none}.answer-romaji summary:before{content:"▸";display:inline-block;margin-right:7px;transition:transform .15s}.answer-romaji[open] summary:before{transform:rotate(90deg)}.answer-romaji div{margin:5px 0 0 18px;color:var(--mu);font-size:14px}
/* ===== Grammatica ===== */
.gr-rule{padding:18px 20px}.gr-rule h3{margin:8px 0 6px;font-size:19px;letter-spacing:-.01em}.gr-explain{margin:7px 0;line-height:1.7}
.gr-model{margin-top:12px;padding:12px 14px;background:var(--bg2);border-left:3px solid var(--ac);border-radius:0 10px 10px 0;line-height:1.7;color:var(--tx);font-size:15px}.gr-model .gr-translation{color:var(--mu);font-weight:500}.gr-model b{color:var(--tx)}.gr-translation{color:var(--tx);font-weight:500}
.gr-more{margin-top:10px;border-top:1px solid var(--bd);padding-top:9px}.gr-more summary{cursor:pointer;list-style:none;color:var(--ac);font-weight:600;user-select:none}.gr-more summary::-webkit-details-marker{display:none}.gr-more summary:before{content:"▸";display:inline-block;margin-right:8px;transition:transform .15s}.gr-more[open] summary:before{transform:rotate(90deg)}
.gr-examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}.gr-example{padding:11px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px}.jp-example{font-size:19px;margin-bottom:4px}
.gr-toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.gr-toc a{font-size:13px;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 11px}
.gr-toc a:hover{border-color:var(--ac);color:var(--ac)}

.counter-key{display:flex;flex-wrap:wrap;align-items:center;gap:7px 16px;margin:9px 0 12px;color:var(--mu);font-size:12px}.counter-key-mark{display:inline-flex;align-items:center;gap:6px}.counter-key-swatch{display:inline-block;width:12px;height:12px;border:1px solid var(--ac);border-radius:3px;background:var(--ac-soft)}.day-cell.counter-changed{border-color:var(--ac);background:var(--ac-soft)}.counter-change-label{display:block;margin-top:4px;color:var(--ac);font-size:10px;font-style:normal;font-weight:700;line-height:1.2}
@media(hover:none){.kbd-hint{display:none!important}}
/* ===== Kanji scrittura (modello dell'app) ===== */
.btn.tool{padding:8px 12px;font-size:14px;border-radius:10px}.btn.tool.on{border-color:var(--ac);color:var(--ac);background:var(--ac-soft)}.btn:disabled{opacity:.5;cursor:default}
.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.kstats div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow)}.kstats b{display:block;font-size:24px}.kstats span{font-size:12px;color:var(--mu)}
.kfilters .chip{cursor:pointer}.klegend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--mu);margin:4px 0}.klegend span{display:inline-flex;gap:6px;align-items:center}
.kdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bd);border:1px solid var(--mu)}.kdot.studied{background:var(--ac2);border-color:var(--ac2)}.kdot.written{background:var(--ok);border-color:var(--ok)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.kitem{position:relative}.kopen{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px 10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;cursor:pointer;color:var(--tx);box-shadow:var(--shadow)}.kopen:hover{border-color:var(--ac)}.kitem.sel .kopen{border-color:var(--ac);background:var(--ac-soft)}

const G=[[1,"です (copula)","Il predicato nominale è un nome + です, che vale “essere”. Con か finale diventa domanda.","私のいぬは12キロです。 Watashi no inu wa 12 kiro desu. “Il mio cane pesa 12 chili.”"],[1,"の (specificazione)","Lega due nomi: il primo specifica o modifica il secondo, che viene dopo.","日本語の学生 nihongo no gakusei = studente di lingua giapponese"],[1,"方 kata / 人 jin","Entrambi = “persona”. 方 è più formale (2ª e 3ª persona) e si lega con の; 人 è meno formale e si attacca al nome (日本人).","日本の方 nihon no kata · 日本人 nihonjin"],[1,"は (tema)","La particella は (si legge “wa”) evidenzia il tema/soggetto della frase.","かわぐちさんは学生です。"],[1,"さん","Suffisso dopo il nome della 2ª e 3ª persona, mai della 1ª.","山下さん Yamashita-san"],[1,"Negazione di です","ではありません dewaarimasen oppure じゃありません jaarimasen. Non cambia con numero o genere.","かわぐちさんは山下さんのともだちじゃありません。"],[1,"そうですか","“Davvero?”, “Ah sì?”: mostra che hai capito e che sei interessato alla conversazione.","そうですか。Sō desu ka."],[1,"か (domanda)","Quando です è seguito dalla particella finale か, la frase diventa una domanda.","あなたはかいしゃいんですか。 “È un impiegato?”"],[1,"ええ","Usato nelle risposte affermative, più colloquiale di はい. Come そうですか, mostra anche interesse nella conversazione.","ええ、そうです。"],[1,"へえ","Esclamazione informale che sottolinea stupore.","へえ hē"],[1,"何 nan / nani","Pronome interrogativo “che cosa?”. Quando 何 compare nella frase, questa termina con か.","あなたのしゅみは何ですか。"],[1,"も (anche)","Particella enfatica che significa “anche”, riferita al sostantivo che la precede.","マリアさんもアラビア語の学生です。 “Anche Maria è una studentessa di arabo.”"],[1,"と (e)","Tra due sostantivi equivale alla congiunzione “e”.","わたしのしゅみはえいがとおんがくです。 “I miei hobby sono il cinema e la musica.”"],[1,"Omissione del predicato","Se l’argomento è chiaro, si può lasciare solo il soggetto e dire la frase con intonazione ascendente, come una domanda.","お名前は？ Onamae wa? “Il suo nome?”"],
[2,"Dimostrativi: これ・それ・あれ","I pronomi dimostrativi indicano una persona o una cosa senza nominarla: これ (vicino a chi parla), それ (vicino a chi ascolta), あれ (lontano da entrambi). Non cambiano per genere o numero.","これは何ですか。 Kore wa nan desu ka. “Che cos’è questo?”"],
[2,"Dimostrativi: この・その・あの","Queste forme accompagnano sempre un nome: この本 = questo libro; その本 = quel libro vicino a chi ascolta; あの建物 = quell’edificio laggiù. Non usarle da sole.","この本は日本語の本です。 Kono hon wa nihongo no hon desu."],
[2,"誰・誰の (chi / di chi)","誰 (dare) significa “chi?”. Con の diventa 誰の (dare no), “di chi?”. La particella の si usa come nell’Unità 1 per indicare possesso o specificazione.","これは誰の本ですか。 Kore wa dare no hon desu ka. “Di chi è questo libro?”"],
[2,"Omissione del nome già noto","Se dal contesto è chiaro il nome sottinteso, dopo の si può omettere. La regola riprende l’omissione del predicato vista nell’Unità 1.","それはエレナさんの（本）です。 Sore wa Erena-san no (hon) desu."],
[2,"Mesi: numero + 月","Per i mesi si usa il numero di origine cinese seguito da 月 (がつ, gatsu): 一月 ichigatsu (gennaio), 二月 nigatsu (febbraio), 九月 kugatsu (settembre). 何月 (なんがつ, nangatsu) significa “quale mese?”.","誕生日は何月ですか。 Tanjōbi wa nangatsu desu ka."],
[2,"Giorni del mese","I primi dieci giorni hanno letture irregolari: 一日ついたち, 二日ふつか, 三日みっか, 四日よっか, 五日いつか, 六日むいか, 七日なのか, 八日ようか, 九日ここのか, 十日とおか. Attenzione anche a 十四日じゅうよっか, 二十日はつか e 二十四日にじゅうよっか.","誕生日は五月二十日です。 Tanjōbi wa gogatsu hatsuka desu."],
[2,"Compleanno: いつ","いつ (itsu) significa “quando?”. Per chiedere la data si può usare 誕生日はいつですか. Per precisare mese e giorno si usano i contatori 月 e 日. Al posto di いつ si può chiedere direttamente mese e giorno con 何月何日 (nangatsu nannichi): 誕生日は何月何日ですか。","モリさんの誕生日はいつですか。 Mori-san no tanjōbi wa itsu desu ka."],
[2,"Prefisso cortese お (お誕生日)","Mettendo il prefisso お (o) davanti a un sostantivo, l’espressione diventa più formale e gentile: 誕生日 → お誕生日. Si usa parlando delle cose dell’interlocutore, non delle proprie.","森さんのお誕生日はいつですか。 Mori-san no otanjōbi wa itsu desu ka."],
[2,"何の: di che cosa? che tipo di?","何の (nan no) + nome chiede il contenuto o il tipo di qualcosa, mentre 誰の chiede il proprietario. それは何の本ですか → “Di che cosa parla quel libro?”; これは誰の本ですか → “Di chi è questo libro?”.","それは何の本ですか。 Sore wa nan no hon desu ka."],
[2,"Due serie di numeri","Esistono due serie numeriche: una di origine cinese (いち, に, さん…) e una di origine giapponese (ひと, ふた, み…). Si sceglie la serie in base al classificatore: i mesi usano la serie cinese, i primi dieci giorni del mese quella giapponese.","一月 ichigatsu · 二日 futsuka"],
[2,"Età: ～才・何才","才 (さい, sai) è il contatore degli anni di età; 何才 (なんさい, nansai) chiede “quanti anni?”. La forma tradizionale per vent’anni è はたち (二十才). Alcuni numeri cambiano pronuncia davanti a sai: いっさい, はっさい, はたち. Il libro scrive l’età con 才 (さい).","モリさんは二十一才です。 Mori-san wa nijūissai desu."],
[2,"Numeri di telefono","Per leggere un numero di telefono si pronunciano le cifre una per una, senza un contatore. 何番 (なんばん, nanban) chiede “quale numero?”. La struttura delle domande con ですか riprende l’Unità 1.","電話番号は何番ですか。 Denwa bangō wa nanban desu ka."],
[2,"Ripasso: は・です・か insieme ai dimostrativi","Per fare una domanda con un dimostrativo, conserva la struttura già studiata: tema + は + nome/predicato + です + か. の può aggiungere una specificazione o indicare il proprietario.","あの建物は美術館ですか。 Ano tatemono wa bijutsukan desu ka."],
[3,"どこ・どこの: chiedere dove","どこ (doko) è l’interrogativo “dove?”. どこの + nome chiede “di quale luogo?”. La struttura riprende は, の e です già studiati.","レストランはどこですか。 Resutoran wa doko desu ka."],
[3,"おいしい: l’aggettivo prima del nome","おいしい (oishii) significa “buono, delizioso” ed è un aggettivo in い. In questa unità si osserva che l’aggettivo precede il nome; la coniugazione si affronta nell’Unità 7.","おいしい日本料理。 Oishii Nihon ryōri."],
[3,"ええと: prendere tempo mentre si pensa","ええと (ēto) è un’espressione usata durante una pausa, mentre si pensa a cosa rispondere: “dunque…”, “vediamo…”.","ええと、本を二冊とCDを七枚。 Ēto, hon o ni-satsu to CD o nanamai."],
[3,"Questo posto e laggiù: ここ・そこ・あそこ","ここ indica un luogo vicino a chi parla, そこ un luogo vicino a chi ascolta e あそこ un luogo lontano da entrambi. Per accompagnare un nome si riprendono le forme già studiate この・その・あの. Nel dialogo compare anche この近く, “qui vicino”.","本屋さんはあそこです。 Honya-san wa asoko desu."],
[3,"Piani: ～階・何階","階 (かい, kai) è il classificatore per i piani di un edificio. Si combina con il numero; il libro richiama la variazione fonetica di 三階 (さんがい, sangai). Per chiedere il piano si usa 何階 (なんがい, nangai).","あのレストランは二階です。 Ano resutoran wa nikai desu."],
[3,"Libri e volumi: ～冊","冊 (さつ, satsu) è il classificatore usato per contare libri e quaderni. Si mette dopo il numero: 二冊, 三冊. Anche qui alcune combinazioni cambiano suono, come mostrato nello schema.","本を二冊とノートを三冊ください。 Hon o ni-satsu to nōto o san-satsu kudasai."],
[3,"Oggetti piatti e sottili: ～枚","枚 (まい, mai) è il classificatore per oggetti piatti e sottili, come francobolli e cartoline. Il numero precede 枚; le letture nello schema mostrano la forma regolare.","切手を五枚ください。 Kitte o go-mai kudasai."],
[3,"Oggetti cilindrici: ～本","本 (ほん, hon) si usa per contare oggetti lunghi o cilindrici. Il suono cambia in alcune combinazioni: nel libro compare 六本, letto ろっぽん; per chiedere “quanti?” si usa 何本, letto なんぼん.","やきとりを三本ください。 Yakitori o san-bon kudasai."],
[3,"Chiedere il prezzo: いくら","いくら (ikura) è l’interrogativo usato per chiedere il prezzo: nome は いくらですか. Per rispondere si dice l’importo e poi la valuta. Euro, dollari e yen indicano già l’unità monetaria, quindi non richiedono un altro classificatore.","これはいくらですか。 Kore wa ikura desu ka."],
[3,"は come tema: “per quanto mi riguarda”","Nella frase 私はさしみランチ, は introduce il tema “per quanto mi riguarda”. In questo uso non presenta 私 come soggetto grammaticale di un predicato: specifica a chi si riferisce l’ordine.","私はさしみランチ。 Watashi wa sashimi ranchi."] ,
[3,"Orari: ～時・半・何時","時 (じ, ji) è il classificatore per le ore. La serie usa i numeri di origine cinese, con due forme da memorizzare: 4時 si legge よじ (yoji) e 9時 si legge くじ (kuji), come spiega il libro. 半 (はん, han) aggiunge “e mezza”; 何時 (なんじ, nanji) chiede l’ora.","今、二時半です。 Ima, ni-ji han desu."],
[3,"Richieste: ～をください","Per ordinare o chiedere un oggetto si usa nome + をください (o kudasai). を marca ciò che si chiede; ください rende la richiesta cortese. Si possono collegare più oggetti con と.","やきとりランチをください。 Yakitori ranchi o kudasai."],
[3,"La particella finale よ","よ (yo) si usa a fine frase per enfatizzare quanto si sta dicendo.","この近くですよ。 Kono chikaku desu yo."],
[3,"La particella finale ね","ね (ne) si usa a fine frase per condividere l’affermazione con l’interlocutore e cercarne la partecipazione.","本屋さんがいいですね。 Honya-san ga ii desu ne."],
[4,"どこ con あります・います","Nell’Unità 3 どこ si usava con です. Ora si usa anche con i verbi あります e います per chiedere dove si trova qualcosa o qualcuno.","不動産屋はどこにありますか。 Fudōsanya wa doko ni arimasu ka."],
[4,"あります・います: esserci","あります (arimasu) e います (imasu) significano “esserci” ed esprimono esistenza e presenza: あります per le cose inanimate, います per gli esseri viventi. Schema: luogo + に + soggetto + が + あります/います. Se il soggetto non è l’informazione nuova si usa は: soggetto + は + luogo + に + あります/います; in questo caso l’informazione importante è il luogo.","大学に学生がおおぜいいます。 Daigaku ni gakusei ga ōzei imasu."],
[4,"L’ausiliare -ます: presente e passato","Con あります e います si impara l’ausiliare -masu, che servirà per tutti i verbi dell’Unità 5. Presente (non passato): -ます (affermativo), -ません (negativo). Passato: -ました (affermativo), -ませんでした (negativo).","あります · ありません · ありました · ありませんでした"],
[4,"Indicare la posizione: luogo + の + 上・下・中…","Per precisare dove si trova qualcosa si usa: luogo + の + indicazione di posizione. Indicazioni: 上 ue (sopra), 下 shita (sotto), 左 hidari (sinistra), 右 migi (destra), 中 naka (dentro), 外 soto (fuori), 前 mae (davanti), 近く chikaku (vicino), 横 yoko (di fianco), 間 aida (tra).","かばんの中 kaban no naka “dentro la borsa” · つくえの上 tsukue no ue “sopra la scrivania”"],
[4,"何か・誰か・どこか (indefiniti)","Gli interrogativi 何, 誰, どこ seguiti da か diventano indefiniti: 何か “qualcosa”, 誰か “qualcuno”, どこか “da qualche parte”. Alla risposta negativa si usa 何も + negativo: 何もありません “non c’è nulla”.","いすの下に何かありますか。 Isu no shita ni nani ka arimasu ka."],
[4,"や: elenco non completo","と unisce i nomi quando l’elenco è completo. Se invece si citano solo alcuni esempi si usa や (ya), spesso con など alla fine (“ecc.”).","大学の前や駅の近くなどにあります。 Daigaku no mae ya eki no chikaku nado ni arimasu."],
[4,"その: riferimento a ciò di cui si è parlato","その può non indicare la posizione, ma riferirsi a qualcosa già nominato nel discorso: その不動産屋 = “quell’agenzia (di cui abbiamo parlato)”.","その不動産屋に友だちがいます。 Sono fudōsanya ni tomodachi ga imasu."],
[4,"I giorni della settimana","I giorni si formano con un kanji + 曜日 (yōbi). Per chiedere il giorno si usa 何曜日 (nanyōbi).","今日は金曜日です。 Kyō wa kinyōbi desu."],
[4,"から・まで: da… a…","から (kara) indica il punto di partenza, まで (made) il punto di arrivo, nel tempo e nello spazio. In questa unità si usano per gli orari.","試験は何時からですか。 Shiken wa nanji kara desu ka."],
[4,"Durata: ～時間","Per indicare la durata si aggiunge 間 (kan) alle ore: 2時間 (nijikan) = “per due ore / due ore”.","お昼の2時間は休みですね。 Ohiru no nijikan wa yasumi desu ne."],
[4,"Contare oggetti: ～つ","Il classificatore つ (tsu) conta gli oggetti senza specificarne il tipo. Usa la serie numerica giapponese fino a dieci; per chiedere quanti si usa いくつ (ikutsu).","二つあります。 Futatsu arimasu."],
[5,"I verbi in -ます","Da questa unità tutti i verbi, come あります e います dell’Unità 4, terminano con l’ausiliare -ます nel presente/non passato e nel passato, affermativo e negativo. Ogni verbo è preceduto da una particella scelta in base al tipo di verbo e alla situazione.","行きます · 行きません · 行きました · 行きませんでした"],
[5,"を: complemento oggetto","La particella を (si legge o) marca il complemento oggetto dei verbi transitivi. Finora abbiamo visto は, か, の, も, と (Unità 1), を (Unità 3), が, から, まで (Unità 4).","A：何をしますか。B：カーニバルのパーティをします。 Nani o shimasu ka. Kānibaru no pāti o shimasu."],
[5,"特別: un altro tipo di aggettivo","特別 (tokubetsu) “speciale, particolare” è un aggettivo di tipo diverso da おいしい (Unità 3): davanti al nome prende な (特別な服). I gruppi di aggettivi si studiano nell’Unità 7.","特別な服を着ます。 Tokubetsu na fuku o kimasu."],
[5,"へ: moto a luogo","La particella へ (scritta con il segno hiragana “he” ma letta e) indica la direzione del movimento e segue il luogo verso cui si va.","日本へ行きました。 Nihon e ikimashita."],
[5,"Invitare: ～ませんか","Il negativo interrogativo del verbo si usa per invitare qualcuno a fare qualcosa: “non andiamo…?”, “ti andrebbe di…?”.","いっしょに映画を見ませんか。 Issho ni eiga o mimasen ka."],
[5,"Proporre e accettare: ～ましょう","L’ausiliare -ましょう serve per coinvolgere l’interlocutore, condividere una proposta o accettare un invito: “facciamo…!”. In forma di domanda (～ましょうか) chiede un parere.","A：今晩フランス料理を食べませんか。B：いいですね。食べましょう。"],
[5,"にします: scegliere","Il verbo します con に indica una scelta: “prendo, scelgo…”.","このかばんにします。 Kono kaban ni shimasu."],
[5,"の che collega una descrizione","の può collegare al nome una parte che lo descrive, come una frase relativa: 友だちのエレナさん = “Elena, che è mia amica”.","日本人の友だちです。 Nihonjin no tomodachi desu."],
[5,"どちら","どちら (dochira) equivale a どこ “dove?” (Unità 4), ma è più formale.","どちらですか。 Dochira desu ka."],
[5,"で: mezzo","Con i verbi di movimento, で (de) indica il mezzo con cui ci si sposta.","電車で行きます。 Densha de ikimasu."],
[5,"かかります: quanto tempo ci vuole","かかります dopo un’indicazione di tempo esprime il tempo necessario per un’azione. Le ore sono seguite da 間 (kan), che indica la durata: 2時間 “due ore / per due ore”. Per chiedere si usa どのくらい.","ローマからボルツァーノまで電車で4時間半くらいかかります。"],
[5,"に: momento preciso","に (ni) dopo un’espressione di tempo indica il momento esatto in cui avviene l’azione.","A：火曜日に帰りますか。B：いいえ。木曜日に帰ります。"],
[5,"に e へ con i verbi di movimento","Prima di un verbo di movimento に ha la stessa funzione di へ: に sottolinea la destinazione, へ la direzione.","京都に行きます。 · 京都へ行きます。"],
[5,"が e は: dove cade l’attenzione","が marca il soggetto quando è l’informazione nuova o importante: 誰が話しましたか, l’interesse è sul “chi”. Con は l’interesse è su ciò che viene dopo: ファビオさんはどこにいますか, l’interesse è sul “dove”.","誰が話しましたか。 Dare ga hanashimashita ka."],
[5,"も + negativo: niente, da nessuna parte","も, da sola o dopo un’altra particella, con il verbo negativo esprime “niente, nessuno, da nessuna parte”: 何も, どこにも.","どこにも行きません。 · 何も食べませんでした。"],
[5,"から: perché","から alla fine della frase, dopo il verbo, la rende causale: “perché…”.","どこにも行きません。日本から友だちが来ますから。"],
[6,"です al passato: でした・ではありませんでした","Nell’Unità 1 abbiamo visto です nella forma non passata affermativa e negativa (ではありません / じゃありません). Al passato diventa でした (affermativo) e ではありませんでした (negativo).","これは私の小学校でした。 Kore wa watashi no shōgakkō deshita."],
[6,"どなた: chi (formale)","どなた (donata) è il pronome interrogativo “chi?”. È più formale rispetto a 誰 (dare), spiegato nell’Unità 2.","どなたと行きましたか。 Donata to ikimashita ka."],
[6,"と: complemento di compagnia","La particella と (to) marca il complemento di compagnia: “con”. Con l’aggiunta di は, とは (to wa) rende la frase con il complemento di compagnia al negativo.","日本へティーナさんと行きました。 Nihon e Tīna-san to ikimashita."],
[6,"Contare le persone: ～人","Per contare le persone si usa il contatore 人 (nin) con la serie numerica di origine cinese. Attenzione alle eccezioni dei primi due numeri: 一人 hitori “una persona”, 二人 futari “due persone”. Con で dopo il numero di persone si dice 一人で hitori de “da solo”, 二人で futari de “in due”.","トスカーナには一人で行きましたか。 Tosukāna ni wa hitori de ikimashita ka."],
[6,"が: “ma” tra due frasi","La particella が (ga) alla fine di una frase subordinata collega due proposizioni con funzione avversativa: “…, ma …”.","部屋に入りましたが、だれもいませんでした。 Heya ni hairimashita ga, dare mo imasendeshita."],
[6,"で: luogo dell’azione","で (de) dopo un luogo indica che in quel posto si svolge l’azione indicata dal verbo che segue.","電車で本を読みました。 Densha de hon o yomimashita."],
[6,"とか: elenco non completo","Per esprimere “e anche, ad esempio, e ancora” in un elenco non completo, oltre a や (Unità 4) si può usare とか (toka).","ミラノとか、ナポリとか。 Mirano toka, Napori toka."],
[6,"I verbi al passato: ～ました・～ませんでした","Nell’Unità 5 abbiamo studiato -ます e -ません. In questa unità troviamo il passato affermativo -ました (mashita) e negativo -ませんでした (masendeshita).","家までバスで1時間かかりました。 Ie made basu de ichi jikan kakarimashita."],
[6,"もう e まだです","もう (mō) con il verbo al passato, in domanda o in affermazione, indica che qualcosa è già stato fatto. Per rispondere che non è ancora stato fatto si dice まだです (mada desu) “non ancora”.","A：もうこの映画を見ましたか。B：いいえ、まだです。"],
[6,"Espressioni di tempo","先 (sen) indica anteriorità: 先週 senshū “settimana scorsa”, 先月 sengetsu “mese scorso”. 今 (ima) “ora” forma 今日 kyō, 今月 kongetsu, 今週 konshū. 来 (“venire”) forma 来月 raigetsu “mese prossimo” e 来週 raishū “settimana prossima”.","先週の火曜日は休みでした。 Senshū no kayōbi wa yasumi deshita."],
[7,"Aggettivi in い e in な","Gli aggettivi giapponesi non hanno numero né genere, ma si coniugano come i verbi. Ci sono due tipi: gli aggettivi in い, che terminano con la vocale i staccata dalla sillaba precedente (おいしい, 大きい, 近い, 新しい, 高い), e gli aggettivi in な, che non terminano con la i staccata (特別, 親切, 有名, oltre agli aggettivi scritti in katakana). Fanno eccezione きれい, la cui i finale fa parte della parola (è un aggettivo in な), e いい, che ha una coniugazione irregolare.","高いレストラン · 有名なレストラン"],
[7,"Funzione attributiva e predicato aggettivale","In funzione attributiva l’aggettivo precede sempre il nome: gli aggettivi in い non cambiano, quelli in な prendono il suffisso な. Come predicato aggettivale l’aggettivo sta a fine frase: quello in い si coniuga cambiando la sua forma (です serve solo a rendere la frase più gentile), quello in な si coniuga attraverso la copula です che lo segue.","広い部屋 hiroi heya “un’ampia stanza” · 有名な人 yūmeina hito “una persona famosa”"],
[7,"Coniugazione degli aggettivi","Gli aggettivi hanno presente e passato, affermativo e negativo. In い: 高い → 高かった (passato), 高くない / 高くありません (negativo), 高くなかった / 高くありませんでした (passato negativo). In な: しずかです → しずかでした, しずかではありません, しずかではありませんでした. いい è irregolare: よかった, よくない, よくなかった.","日本の夏はとても暑かったです。 Nihon no natsu wa totemo atsukatta desu."],
[7,"Comparativo: AはBより","Per confrontare due termini: primo termine + は, secondo termine + より, poi l’aggettivo. La stessa costruzione vale per il comparativo di maggioranza e, con l’aggettivo al negativo, di minoranza.","日本の夏はイタリアの夏より暑いです。 Nihon no natsu wa Itaria no natsu yori atsui desu."],
[7,"Uguaglianza: と同じくらい","Per il comparativo di uguaglianza: primo termine + は, secondo termine + と同じくらい (to onaji kurai) + aggettivo: “tanto … quanto”.","京都も前橋と同じくらい暑かったです。 Kyōto mo Maebashi to onaji kurai atsukatta desu."],
[7,"Superlativo: で一番 e とても","Superlativo relativo: ambito + で一番 (de ichiban) + aggettivo: “il più … di/in”. Superlativo assoluto: un avverbio come とても prima dell’aggettivo.","日本で一番暑いのは前橋です。 Nihon de ichiban atsui no wa Maebashi desu."],
[7,"そうですね: dunque…","そうですね (sō desu ne) all’inizio di una frase indica che chi parla prende tempo per organizzare la risposta. Rende la conversazione più fluida e partecipata.","そうですね、日本の夏はイタリアの夏より暑いですから、たいへんでした。"],
[7,"ほど + negativo: non così … come","ほど (hodo) seguito da un aggettivo in forma negativa esprime “non così … come”.","外食はイタリアほど高くありません。 Gaishoku wa Itaria hodo takaku arimasen."],
[7,"Unire gli aggettivi: ～くて・～で","Per unire due o più aggettivi: quelli in い perdono la i finale e prendono la forma in く + て (安い → 安くて); quelli in な aggiungono で (有名 → 有名で). L’ultimo aggettivo resta nella forma normale.","安くておいしいレストラン · 有名で安いレストラン"],
[7,"好き: piacere","好き (suki) “piacere” in funzione attributiva si coniuga come un aggettivo in な (好きな食べ物). Per esprimere una preferenza: S が好きです “mi piace S”; chi prova la preferenza è seguito di solito da は.","私はすしが好きです。 Watashi wa sushi ga suki desu."],
[7,"の al posto del nome","Come nell’Unità 2, per non ripetere un nome già chiaro dal contesto lo si sostituisce con の. Succede spesso nelle risposte.","A：一番好きな食べ物は何ですか。B：一番好きなのはおすしです。"],
[7,"僕: io (maschile)","In giapponese i pronomi personali si usano poco. 僕 (boku) è un pronome di prima persona usato solo dagli uomini.","僕もすしがいちばん好きです。 Boku mo sushi ga ichiban suki desu."],
[7,"それに: inoltre","それに (soreni) significa “inoltre, in aggiunta” e aggiunge un motivo in più a quanto detto nella frase precedente.","日本ほどおいしくありません。それに、日本より高いです。"],
[8,"どうして: perché?","L’avverbio interrogativo “perché?” nella domanda si rende con どうして (dōshite); nella risposta si può usare から (kara), visto nell’Unità 5.","A：どうしてトリノに行きましたか。B：トリノで学会がありましたから。"],
[8,"で con あります: svolgersi","La particella で, che indica il luogo dove avviene un’azione, si trova dopo il luogo anche con あります quando significa “svolgersi, tenersi” (al posto di verbi come 行われます “svolgere”).","教室で授業がありました。 Kyōshitsu de jugyō ga arimashita."],
[8,"Confronto tra due: どちら e の方が","Per confrontare due elementi (persone, oggetti o luoghi) si usa どちら (dochira): A と B と どちらが … ですか. Nella risposta l’elemento scelto è seguito da の方が (no hō ga) per metterlo in evidenza.","A：東京とローマとどちらが大きいですか。B：東京の方が大きいです。"],
[8,"Confronto tra tre o più: どれ・誰・どこ・いつ + 一番","Con tre o più elementi non si usa どちら, ma どれ (oggetti), 誰 (persone), どこ (luoghi), いつ (tempo) + が一番. L’elenco può chiudersi con の中で o の中では per indicare l’ambito del confronto. Se il confronto è generico si usa 何.","日本料理の中で何が一番好きですか。 Nihon ryōri no naka de nani ga ichiban suki desu ka."],
[8,"Desiderativo: ～たい（です）","Per dire “voglio, vorrei fare”: si toglie -ます dal verbo e si aggiunge -たい (行きます → 行きたい). -たい si coniuga come un aggettivo in い; です rende la frase più gentile.","私もトリノに行きたいです。 Watashi mo Torino ni ikitai desu."],
[8,"でも: però","でも (demo) all’inizio di una frase è una congiunzione avversativa: “però, ma”. È meno formale della particella が vista nell’Unità 6.","トリノはとてもきれいでした。でも、トリノの方がローマより寒かったですよ。"],
[8,"La forma in て: come si forma","Si toglie -ます e si guarda l’ultima sillaba. Verbi del gruppo V5 (pentagrada): い・ち・り → って; み・び・に → んで; き → いて; ぎ → いで; し → して. Verbi del gruppo V1 (unigrada): si toglie -ます e si aggiunge て (食べます → 食べて). Forme particolari: 来ます → 来て, します → して, 行きます → 行って.","読みます → 読んで · 書きます → 書いて · 食べます → 食べて"],
[8,"La forma in て: azioni in sequenza","Con la forma in て si uniscono più azioni nell’ordine in cui avvengono; la frase si chiude con il verbo in -ます. Si usa anche per rispondere a どうやって “in che modo?”, elencando le azioni compiute per arrivare a una meta.","きのう7時に起きて、コーヒーを飲んで、新聞を読んで、会社に行きました。"],
[8,"ほか: altro, oltre a","ほか (hoka) significa “oltre a, in aggiunta a”. Precede il nome a cui si riferisce ed è collegato con の.","ほかのヨーロッパの国へ行きましたか。 Hoka no Yōroppa no kuni e ikimashita ka."],
[8,"La forma in て: causa","La forma in て può anche collegare una causa alla frase che segue; in italiano si rende spesso con il gerundio.","学会があっていろいろなところへ行きました。 Gakkai ga atte iroirona tokoro e ikimashita."],
[8,"～回: quante volte","Il contatore 回 (kai) conta le volte in cui si compie un’azione: 2回 “due volte”. 何回も (nankai mo) significa “molte volte”.","ロンドンへは2回行きました。 Rondon e wa nikai ikimashita."],
[9,"～がほしいです: volere qualcosa","Nome + がほしいです (ga hoshii desu) significa “voglio S”: chi desidera è marcato da は, l’oggetto desiderato da が. ほしい è un aggettivo in い e si coniuga come tale (ほしかった, ほしくない…).","私は車がほしいです。 Watashi wa kuruma ga hoshii desu."],
[9,"～てください: richieste e indicazioni","Forma in て + ください (kudasai) esprime una richiesta o un’indicazione: si usa per dare istruzioni o segnalazioni. Per chiedere un favore con più gentilezza si usa la forma negativa interrogativa ～てくださいませんか, oppure si comincia con どうぞ “prego”.","もう一度見せてくださいませんか。 · どうぞ私の本を使ってください。"],
[9,"～てから: dopo che","Forma in て + から (kara) esprime “dopo che”: si trova alla fine della frase subordinata e precede l’azione della frase principale.","毎朝コーヒーを飲んでから家を出ます。 Mai asa kōhī o nonde kara ie o demasu."],
[9,"～てもいいですか: chiedere il permesso","Forma in て + もいいですか (mo ii desu ka) serve per chiedere il permesso di fare un’azione: “posso…?”. Si risponde はい、どうぞ oppure すみません、ちょっと….","教室に入ってもいいですか。 Kyōshitsu ni haitte mo ii desu ka."],
[9,"～ています: azione in corso o stato","Forma in て + います indica uno stato, una condizione, il risultato di un’azione (結婚しています “è sposato”, 住んでいます “abita”, 売っています “si vende”). Con un’indicazione di tempo come 今 “ora” esprime un’azione in corso di svolgimento.","今音楽を聞いています。 Ima ongaku o kiite imasu."],
[9,"Due verbi in sequenza: modo dell’azione","Quando due verbi sono consecutivi e il primo è nella forma in て, il primo indica non solo l’ordine delle azioni ma anche il modo in cui si svolge la seconda.","電話をして、聞いてみます。 Denwa o shite, kiite mimasu."],
[9,"～てみます: provare a fare","Forma in て + みます (mimasu) significa “provare a fare qualcosa e vedere il risultato”: più che “tentare”, indica il mettersi alla prova.","初めてすしを食べてみました。 Hajimete sushi o tabete mimashita."],
[9,"～てしまいます: conclusione imprevista","Forma in て + しまいます (shimaimasu) esprime la conclusione di un’azione, di solito imprevista e spesso negativa. Nel Volume 1 si studia solo questo uso.","もう家に帰ってしまいましたよ。 Mō ie ni kaette shimaimashita yo."],
[9,"で: il modo","La particella で (de) indica anche in che modo si fa un’azione, per esempio la lingua con cui si parla o si scrive.","山田先生と日本語で話します。 Yamada-sensei to nihongo de hanashimasu."],
[10,"La forma in た: come si forma","La forma in た (V-ta) è il passato della forma piana e si forma come la forma in て: si toglie -ます e si guarda l’ultima sillaba. V5: い・ち・り → った; み・び・に → んだ; き → いた; ぎ → いだ; し → した. V1: si toglie -ます e si aggiunge た (食べます → 食べた). Forme particolari: 来ます → 来た, します → した, 行きます → 行った.","読みます → 読んだ · 書きます → 書いた · 食べます → 食べた"],
[10,"～たことがあります: l’esperienza","Forma in た + ことがあります (koto ga arimasu) indica di aver avuto un’esperienza, di aver fatto o provato una volta qualcosa. Al negativo: ～たことがありません “non ho mai…”.","日本へ行ったことがあります。 Nihon e itta koto ga arimasu."],
[10,"～た方がいいです: dare un consiglio","Forma in た + 方がいい（です）(hō ga ii desu) si usa per dare consigli: “sarebbe meglio che…, faresti meglio a…”. Non indica il passato. Si usa con persone a cui ci si può permettere di dare consigli.","帰った方がいいです。 Kaetta hō ga ii desu."],
[10,"～たり～たりします: elencare azioni","Forma in た + り, ripetuta, e poi します serve per elencare in modo non completo alcune azioni (con la forma in て invece si elencano tutte, in ordine). Si usa anche per azioni che tendono a ripetersi.","本を買ったり、図書館へ行ったりします。 Hon o kattari, toshokan e ittari shimasu."],
[10,"で: il motivo di un giudizio","La particella で (de) può indicare il motivo per cui si dà un giudizio o si fa un’affermazione.","日本研究で有名な大学 Nihon kenkyū de yūmeina daigaku"],
[10,"～になります・～になりたいです","Nome + に + なります (narimasu) indica un cambiamento: “diventare”. Nome + に + なりたいです significa “voler diventare qualcuno”.","日本研究者になりたいです。 Nihon kenkyūsha ni naritai desu."],
[11,"La forma in ない: come si forma","La forma in ない (V-nai) è il negativo presente della forma piana ed è la base di diverse strutture. V5: si toglie -ます e l’ultima sillaba passa dalla riga i alla riga a, poi si aggiunge ない: い → わない (attenzione: い diventa わ), ち → たない, り → らない, み → まない, び → ばない, に → なない, き → かない, ぎ → がない, し → さない. V1: si toglie -ます e si aggiunge ない (食べます → 食べない, 出ます → 出ない). Da ricordare: 来ます → 来ない (konai), します → しない, 行きます → 行かない.","あらいます → あらわない · 待ちます → 待たない · 食べます → 食べない"],
[11,"～ないでください: chiedere di non fare","Forma in ない + でください (naide kudasai) è la forma negativa di ～てください (Unità 9): serve per indicare qualcosa che non va fatto, “per favore non…”.","試験の間に、となりの学生と話さないでください。 Shiken no aida ni, tonari no gakusei to hanasanaide kudasai."],
[11,"～ない方がいいです: sconsigliare","Forma in ない + 方がいい（です）(hō ga ii desu) serve per dare consigli su cosa “sarebbe meglio non fare”. È il negativo di ～た方がいいです (Unità 10) e, come quello, non si usa con persone a cui, per età o gerarchia, non ci si può permettere di dare consigli.","うんてんしますから、ワインを飲まない方がいいですよ。 Unten shimasu kara, wain o nomanai hō ga ii desu yo."],
[11,"うまくいきます: andar bene","L’espressione うまくいきます (umaku ikimasu) “andar bene” usa il verbo “andare” in senso figurato: per questo non si scrive con il kanji 行 ma in hiragana.","きっとうまくいきますよ。 Kitto umaku ikimasu yo."],
[11,"中: in corso, durante","Il kanji 中 (chū) dopo un nome indica un’azione in corso di svolgimento (電話中 “essere al telefono”) oppure un arco di tempo (午前中 “nella mattinata”).","電話中です。 Denwa chū desu. · 午前中 gozenchū"],
[11,"Nome + ができます: è possibile","Nome + が + できます (ga dekimasu) indica la possibilità di fare ciò che il nome esprime: “è possibile…, si può…”.","予約ができます。 Yoyaku ga dekimasu."],
[11,"ので: perché (formale)","La particella ので (node) rende la frase causale in modo più formale di から; si usa soprattutto nella lingua scritta.","ちょっとむずかしいので、間違わないでくださいね。 Chotto muzukashii node, machigawanaide kudasai ne."],
[11,"～なくてもいいです: non è necessario","Dalla forma in ない si toglie い e si aggiunge くてもいい（です）: -なくてもいいです (-nakute mo ii desu) indica qualcosa che si può non fare, che non è necessario fare. È il contrario di ～てもいいです (Unità 9), che esprime il permesso.","そのレストランは日曜日こんでいませんので、予約しなくてもいいです。 Sono resutoran wa nichiyōbi kondeimasen node, yoyaku shinakute mo ii desu."]
];

 host.innerHTML=`<div class="kpad-wrap"><div class="kpadhost"></div></div><div class="kdraw-tools"><button class="btn tool" data-f="undo">↶ Annulla tratto</button><button class="btn tool" data-f="clear">✕ Cancella</button>${ghostBtn?`<button class="btn tool" data-f="ghost">💡 Traccia</button>`:""}</div><div class="kfp-res" aria-live="polite"></div><button class="btn ok kfp-check" style="width:100%">Controlla</button>`;
 const pad=new KPad(host.querySelector(".kpadhost")),res=host.querySelector(".kfp-res");let ghost=false;
 host.querySelector('[data-f="undo"]').onclick=()=>pad.undo();host.querySelector('[data-f="clear"]').onclick=()=>{pad.clear();res.innerHTML=""};
 const g=host.querySelector('[data-f="ghost"]');if(g)g.onclick=()=>{ghost=!ghost;pad.showGhost(k,ghost);g.classList.toggle("on",ghost)};
 host.querySelector(".kfp-check").onclick=()=>{const r=KRecog.check(pad.strokes,k);if(r.status==="empty"){res.innerHTML=`<div class="kfp-msg">${r.msg}</div>`;return}const ok=kOK(r);if(!ok&&r.bad)pad.markStrokes(r.bad);
  res.innerHTML=`<div class="kfp-msg ${ok?"good":"bad"}"><b>${ok?"Corretto!":"Non ancora"}</b> ${r.status==="ok"?r.msg:ok?"Attenzione: "+r.msg:r.msg}</div>`;onResult&&onResult(ok,r,pad)};
 return pad}

 h+=`<div class="kselbar ${KV.sel.size?"show":""}"><span><b>${KV.sel.size}</b> selezionati</span><button class="btn tool" onclick="KV.sel.clear();kanjiView()">Deseleziona</button><label class="mu" style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${KV.showReading?"checked":""} onchange="KV.showReading=this.checked"> mostra la lettura</label><button class="btn ok" ${KV.sel.size?"":"disabled"} onclick="kStartPractice([...KV.sel])">Inizia esercizio</button></div>`;

 if(KV.tab==="scheda")h+=`<table class="unit-table kread"><tr><th>Significato</th><td>${J.m}</td></tr><tr><th>On’yomi 音読み</th><td>${J.on}</td></tr><tr><th>Kun’yomi 訓読み</th><td>${J.kun}</td></tr><tr><th>Numero di tratti</th><td>${J.st.length}</td></tr><tr><th>Esempi</th><td>${J.ex}</td></tr></table><div class="kd-all"><b>Tutti i tratti</b>${kStaticSVG(k)}</div>`;
 else if(KV.tab==="anim")h+=`<p class="mu">Guarda come si scrive, tratto dopo tratto. Puoi mettere in pausa, andare avanti o indietro di un tratto e cambiare la velocità.</p><div id="kanim-host"></div>`;

function kStartPractice(ks){ks=ks.filter(k=>KANJI_STROKES[k]);if(!ks.length)return;if(ANIM)ANIM.pause();KPS={items:shuffleArray(ks),i:0,ok:0,miss:[],tried:false,done:false};window.scrollTo(0,0);kPractice()}
function kPractice(){const P=KPS;if(P.i>=P.items.length){const pct=Math.round(P.ok/P.items.length*100);el(`<div class="ex-head"><div class="ex-title">Scrittura dei kanji</div></div><div class="card" style="cursor:default;min-height:200px"><div class="big">${pct>=85?"🎉":"🌱"}</div><div class="mid">${P.ok}/${P.items.length} · ${pct}%</div><div class="mu">${P.miss.length?"Ripassa i kanji sbagliati: "+P.miss.join(" "):"Tutti scritti correttamente al primo tentativo!"}</div></div><div class="row" style="flex-wrap:wrap">${P.miss.length?`<button class="btn ok" onclick="kStartPractice(KPS.miss)">Ripeti gli errori (${P.miss.length})</button>`:""}<button class="btn" onclick="kStartPractice(KPS.items)">Ricomincia</button><button class="btn" onclick="KPS=null;kanjiView()">Torna ai kanji</button></div>`);return}
 const k=P.items[P.i],J=kj(k);P.tried=false;P.done=false;
 el(`<div class="ex-head"><div><div class="ex-title">Scrittura dei kanji</div><div class="ex-sub">${P.i+1} / ${P.items.length} · ✓ ${P.ok} · ✗ ${P.miss.length}</div></div><button class="btn" onclick="if(confirm('Vuoi interrompere l’esercizio?')){KPS=null;kanjiView()}">← Kanji</button></div><div class="bar"><i style="width:${Math.round(P.i/P.items.length*100)}%"></i></div>
 <div class="g"><div class="ex-prompt" style="padding:6px 0"><div class="ex-instr">Scrivi il kanji</div>“${J.m}”${KV.showReading?`<div class="mu" style="font-size:15px">On ${J.on} · Kun ${J.kun}</div>`:""}</div><div id="kp-host"></div><div class="row" id="kp-next" style="display:none"><button class="btn" onclick="kShowSolution()">Mostra la soluzione</button><button class="btn on" onclick="KPS.i++;kPractice()">Prossimo →</button></div><div id="kp-sol"></div></div>`);
 kFree($("kp-host"),k,{ghostBtn:false,onResult:ok=>{const r=kRec(k);r.seen=1;r.tries++;if(ok)r.ok++;const bk="k:"+k+"|"+J.u;if(!P.tried){P.tried=true;if(ok){P.ok++;S.box[bk]=Math.min(5,bx(bk)+1)}else{P.miss.push(k);S.box[bk]=0}}save();$("kp-next").style.display="flex"}})}
function kShowSolution(){const k=KPS.items[KPS.i];if(!KPS.tried){KPS.tried=true;KPS.miss.push(k);S.box["k:"+k+"|"+kj(k).u]=0;save()}$("kp-next").style.display="flex";const h=$("kp-sol");h.innerHTML=`<div style="margin-top:12px"></div>`;ANIM=new KAnim(h.firstChild,k);ANIM.play()}
function initKanjiPad(){const canvas=$("kanji-pad");if(!canvas)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));const ctx=canvas.getContext("2d");ctx.scale(dpr,dpr);ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--tx").trim()||"#222";if(kanjiDrawing){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=kanjiDrawing}}
function startKanjiDraw(e){e.stopPropagation();const canvas=e.currentTarget,ctx=canvas.getContext("2d"),r=canvas.getBoundingClientRect();canvas.setPointerCapture(e.pointerId);kanjiDrawActive=true;ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)}
function moveKanjiDraw(e){if(!kanjiDrawActive)return;e.stopPropagation();const canvas=e.currentTarget,ctx=canvas.getContext("2d"),r=canvas.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()}
function stopKanjiDraw(){if(!kanjiDrawActive)return;kanjiDrawActive=false;const canvas=$("kanji-pad");if(canvas)kanjiDrawing=canvas.toDataURL("image/png")}
function clearKanjiPad(){const canvas=$("kanji-pad");if(!canvas)return;const ctx=canvas.getContext("2d");ctx.clearRect(0,0,canvas.width,canvas.height);kanjiDrawing=null}
let strokeOrderTimer=0;
function showKanjiStrokeOrder(){const host=$("stroke-guide"),i=q[qi],kanji=K[i]?.[0],paths=KANJI_STROKES[kanji];if(!host)return;clearTimeout(strokeOrderTimer);if(!paths){host.hidden=false;host.innerHTML="<div class=\"mu\">Ordine dei tratti non disponibile.</div>";return}host.hidden=false;host.innerHTML=`<svg class="stroke-order-svg" viewBox="0 0 109 109" role="img" aria-label="Ordine di scrittura di ${kanji}">${paths.map((d,n)=>`<path class="stroke-order-path" d="${d}" fill="none" stroke="var(--ac)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" data-step="${n+1}"/>`).join("")}</svg><div id="stroke-order-status" class="stroke-order-status">Preparazione · ${paths.length} tratti</div><div class="stroke-order-credit">Ordine dei tratti: <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a> (Ulrich Apel) · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a></div>`;const nodes=[...host.querySelectorAll(".stroke-order-path")];nodes.forEach(p=>{const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len});let n=0;const next=()=>{const status=$("stroke-order-status");if(!status)return;if(n>=nodes.length){status.textContent=`Completato · ${nodes.length} tratti`;return}const path=nodes[n],len=path.getTotalLength();status.textContent=`Tratto ${n+1} di ${nodes.length}`;path.setAttribute("opacity","1");path.style.transition="stroke-dashoffset 520ms ease";requestAnimationFrame(()=>path.style.strokeDashoffset="0");n++;strokeOrderTimer=setTimeout(next,650)};next()}

function ans(t,i,ok){const k=key(t,i);S.box[k]=ok?Math.min(5,bx(k)+1):0;save();if(!ok)miss.push(i);qi++;flip=false;kanjiDrawing=null;deck(t)}

"今度のイースターに、ドロミティへ行きます。スキーをします。ドロミティはイタリアの北にあります。ローマから電車でボルツァーノまで行きます。ローマから4時間30分くらいです。森さんが、私をさそいました。ボルツァーノ駅にレンタカー会社があります。レンタカーを借ります。車でホテルまで2時間くらいです。ホテルはボルツァーノの東です。ホテルにプールがあります。サウナもあります。南チロルの料理をいろいろ食べます。木曜日に出発します。水曜日にローマへ帰ります。休みは1週間です。":"Questa Pasqua vado sulle Dolomiti. Scio. Le Dolomiti sono nel nord dell’Italia. Da Roma vado in treno fino a Bolzano. Da Roma sono circa 4 ore e 30 minuti. Mi ha invitato Mori. Alla stazione di Bolzano c’è un autonoleggio. Noleggio una macchina. In macchina fino all’albergo ci sono circa 2 ore. L’albergo è a est di Bolzano. Nell’albergo c’è una piscina. C’è anche una sauna. Mangio tanti piatti dell’Alto Adige. Parto giovedì. Mercoledì torno a Roma. La vacanza è di una settimana.",

"明日の晩、ルカさんといっしょにご飯を食べます。マリアさんもさそいました。まず、テルミニ駅の近くに行きます。そして、映画を見ます。フランスの映画です。この映画は2時間ぐらいです。そのあとレストランへ行きます。レストランまでバスで30分くらいです。レストランはメキシコ料理のレストランです。コロッセオの南にあります。私は、はじめてメキシコ料理を食べます。メキシコ料理は豆とタコスです。私はタコスを食べます。":"Domani sera ceno con Luca. Ho invitato anche Maria. Prima andiamo vicino alla stazione Termini. Poi guardiamo un film. È un film francese. Dura circa due ore. Dopo andiamo al ristorante. Fino al ristorante sono circa 30 minuti in autobus. È un ristorante messicano. È a sud del Colosseo. Mangio cucina messicana per la prima volta. La cucina messicana è fagioli e tacos. Io mangio i tacos.",

"先週の金曜日は休みでした。友だちとフィレンツェの温泉へ行きました。まず、フィレンツェに行きました。駅の近くで友だちと会いました。そして、フィレンツェでレストランへ友だちと四人で行きました。男二人と女二人でした。そこでステーキを食べました。あかワインも飲みました。昼から温泉に車でいきました。人がたくさんいました。その温泉は初めてではありませんでした。ずいぶん前に行きました。みんなで温泉に入りました。温泉でビールとトスカーナのワインを飲みました。トスカーナとウンブリアには温泉がたくさんあります。ナポリの近くにも温泉があります。トスカーナとウンブリアの温泉はもう行きました。ナポリの温泉はまだです。ガイドブックで読みました。":"Venerdì della settimana scorsa era festa. Sono andato alle terme vicino a Firenze con degli amici. Prima sono andato a Firenze. Ho incontrato gli amici vicino alla stazione. Poi a Firenze siamo andati al ristorante in quattro: due uomini e due donne. Lì abbiamo mangiato una bistecca. Abbiamo bevuto anche vino rosso. Dal pomeriggio siamo andati alle terme in macchina. C’era tanta gente. Non era la prima volta che andavo in quelle terme: ci ero andato molto tempo fa. Siamo entrati tutti insieme nelle terme. Alle terme abbiamo bevuto birra e vino toscano. In Toscana e in Umbria ci sono molte terme. Ci sono terme anche vicino a Napoli. Alle terme della Toscana e dell’Umbria ci sono già andato. A quelle di Napoli non ancora. L’ho letto in una guida.",

"いつも月曜日はナポリへ行きませんが、先々週と先週の月曜日はナポリに行きました。ナポリで仕事をしました。ナポリは雨でした。来週の月曜日もナポリに行きます。そこで、テストがあります。火曜日はいつもナポリで仕事があります。ナポリまで電車で行きます。1時間10分です。水曜日はローマで仕事をします。ローマ大学へ行きます。大学でほかの先生と仕事をします。今週はその先生とおすしを食べました。日本人のおすし屋さんです。イタリア人ではありません。来週は水曜日も木曜日もその先生とローマ大学で仕事をします。金曜日はナポリに行きます。土曜日はローマの日本人学校へ行きます。":"Di solito il lunedì non vado a Napoli, ma lunedì di due settimane fa e della settimana scorsa ci sono andato. A Napoli ho lavorato. A Napoli pioveva. Anche lunedì prossimo vado a Napoli: lì c’è un esame. Il martedì lavoro sempre a Napoli. Vado a Napoli in treno: ci vogliono un’ora e dieci minuti. Il mercoledì lavoro a Roma. Vado all’Università di Roma. All’università lavoro con un altro professore. Questa settimana ho mangiato il sushi con quel professore. È un ristorante di sushi giapponese, non italiano. La settimana prossima lavoro con quel professore all’Università di Roma sia mercoledì sia giovedì. Venerdì vado a Napoli. Sabato vado alla scuola giapponese di Roma.",

"ことしの夏休みはかぞくと日本へ帰りました。イタリアの夏も暑かったですが、日本の夏はイタリアの夏より暑かったです。日本では東京にいました。日本ではお肉と魚をたくさん食べました。とてもおいしかったです。京都と神戸にも行きました。京都の夏は暑くて有名です。京都は観光客がいっぱいでした。京都には有名な所がたくさんあります。神戸は京都ほど暑くありませんでした。神戸でイタリアの友だちに手紙を書きました。母にも写真をメールで送りました。":"Quest’estate sono tornato in Giappone con la famiglia. Anche l’estate italiana era calda, ma quella giapponese era più calda di quella italiana. In Giappone sono stato a Tōkyō. In Giappone ho mangiato tanta carne e tanto pesce. Era tutto buonissimo. Sono andato anche a Kyōto e a Kōbe. L’estate di Kyōto è famosa perché è calda. Kyōto era piena di turisti. A Kyōto ci sono molti posti famosi. Kōbe non era calda come Kyōto. A Kōbe ho scritto una lettera a un amico italiano. Ho mandato delle foto anche a mia madre per mail.",

"帰りの飛行機はいっぱいでした。日本人の観光客が多かったです。このイタリアの会社は日本からイタリアまで一番早くて、とても便利ですが、チケットは高いです。日本の会社よりご飯がおいしくて、サービスがとてもいいです。ご飯はイタリア料理と日本料理があります。わたしは鳥肉を食べました。おにぎりとサンドイッチもあります。イタリアのビールもワインもジュースもおいしいです。イタリアのワインが一番おいしいです。日本のワインはイタリアのワインほどおいしくないです。ビールは、イタリアのより日本のビールがおいしいです。":"L’aereo del ritorno era pieno. C’erano molti turisti giapponesi. Questa compagnia italiana è la più veloce dal Giappone all’Italia ed è molto comoda, ma i biglietti sono cari. Rispetto alla compagnia giapponese, il cibo è più buono e il servizio è ottimo. Come pasti ci sono cucina italiana e cucina giapponese. Io ho mangiato il pollo. Ci sono anche onigiri e sandwich. La birra, il vino e i succhi italiani sono buoni. Il vino italiano è il più buono. Il vino giapponese non è buono come quello italiano. Quanto alla birra, quella giapponese è più buona di quella italiana.",

"2週間前にトリノで日本の研究学会がありました。私はローマからトリノまで電車で行きました。テルミニ駅までタクシーで行って、そこから、電車に乗りました。朝8時の電車です。12時30分にトリノに着きました。駅でコーヒーを飲んでからバスで大学に行きました。先生や学生がたくさんいました。友だちと会ってお昼ご飯を食べました。大学の近くには小さなレストランがたくさんありました。安いランチがありました。ランチの料理はおいしかったです。午後は友だちの発表をたくさん聞きました。とてもおもしろかったです。":"Due settimane fa a Torino c’è stato un convegno di studi giapponesi. Sono andato da Roma a Torino in treno. Sono andato alla stazione Termini in taxi e da lì ho preso il treno. Era il treno delle 8 di mattina. Sono arrivato a Torino alle 12:30. Alla stazione ho bevuto un caffè e poi sono andato all’università in autobus. C’erano molti professori e studenti. Ho incontrato degli amici e abbiamo pranzato. Vicino all’università c’erano tanti piccoli ristoranti. C’era un pranzo economico. Il cibo del pranzo era buono. Il pomeriggio ho ascoltato molti interventi dei miei amici. Erano molto interessanti.",
"2週間前にどこへ行きましたか。":"Dove sei andato due settimane fa?","そこで何がありましたか。":"Cosa c’era lì?","どうやって行きましたか。":"Come ci sei andato?","だれとお昼ご飯を食べましたか。":"Con chi hai pranzato?","何を食べましたか。":"Cosa hai mangiato?","午後は何をしましたか。":"Cosa hai fatto nel pomeriggio?",
"学校からホテルまで歩いて行きました。15分くらいでした。夜7時半から学会の夕食会がありました。先生と学生がたくさん来ました。トリノの白ワインでかんぱいをして夕食が始まりました。まず、タルタルステーキが出てきて、それから、アニョロッティというパスタです。その次はお肉の料理でした。ピエモンテ地方の赤ワインといっしょに食べました。デザートもトリノの有名なお菓子でした。とても長い夕食でした。とてもおいしかったです。ローマの料理よりトリノの料理の方がおいしいです。次は、家族といっしょにトリノに行きたいです。":"Dalla scuola all’albergo sono andato a piedi. Erano circa 15 minuti. Dalle 7 e mezza di sera c’era la cena del convegno. Sono venuti molti professori e studenti. Abbiamo brindato con il vino bianco di Torino e la cena è cominciata. Prima è arrivata la tartare, poi una pasta chiamata agnolotti. Dopo c’era un piatto di carne. L’abbiamo mangiato con il vino rosso del Piemonte. Anche il dessert era un dolce famoso di Torino. È stata una cena molto lunga. Era tutto molto buono. La cucina di Torino è più buona di quella di Roma. La prossima volta voglio andare a Torino con la mia famiglia.",

"私はさとうです。イタリアのローマ（ ）住んでいます。きょねんの10月（ ）結婚しました。":"Sono Satō. Abito a Roma, in Italia. Mi sono sposata a ottobre dell’anno scorso.","おっと（ ）イタリア人です。車の会社（ ）働いています。車（ ）大好きですから。会社に車（ ）行きます。":"Mio marito è italiano. Lavora in un’azienda di automobili, perché adora le macchine. Va al lavoro in macchina.","私はローマのイタリア語学校（ ）イタリア語を勉強しています。イタリア語の勉強はむずかしいです（ ）、おもしろいです。":"Studio italiano in una scuola di lingua italiana a Roma. Studiare l’italiano è difficile, ma interessante.","クラス（ ）いろいろな国の人（ ）います。来週（ ）学校（ ）試験（ ）あります。":"Nella classe ci sono persone di vari paesi. La settimana prossima a scuola c’è un esame.",
"高山先生は学会があってイタリアのいろいろなところへ行きます。先週はトリノに行きました。ローマに帰ってきてから、来週はレッチェに行きます。イタリアの町の中でローマが一番楽しいです。ローマはとてもきれいな町です。そして食べ物もおいしいです。トリノではおいしい赤ワインを飲みました。それから、いろいろなところの赤ワインを飲んでみました。赤ワインは北イタリアのがおいしくて、白ワインはローマやナポリの近くのワインがいいです。イタリアのワインはたくさんあって、とても楽しいです。":"Il professor Takayama va in vari posti d’Italia per dei convegni. La settimana scorsa è andato a Torino. Dopo essere tornato a Roma, la settimana prossima va a Lecce. Tra le città italiane, Roma è la più piacevole. Roma è una città molto bella, e anche il cibo è buono. A Torino ha bevuto un buon vino rosso. Poi ha provato i vini rossi di vari posti. Il vino rosso del nord Italia è buono, mentre il vino bianco migliore è quello dei dintorni di Roma e Napoli. In Italia ci sono tanti vini ed è molto divertente.",
"高山先生はどうしてイタリアのいろいろなところに行きますか。":"Perché il professor Takayama va in vari posti d’Italia?","先週はどこに行きましたか。":"Dove è andato la settimana scorsa?","レッチェにはどこから行きますか。":"Da dove va a Lecce?","トリノで何を飲みましたか。":"Cosa ha bevuto a Torino?","赤ワインはどこのがおいしいですか。":"Di dove è buono il vino rosso?","白ワインはどうですか。":"E il vino bianco?",
"日本人留学生のみなさんへ":"A tutti gli studenti giapponesi in scambio","ローマ大学での勉強はいかがですか。ローマ大学に来てから問題はありませんか。私たちはローマ大学の日本語の学生です。日本人の留学生を助けますから、何でも私たちに言ってください。電話をしてもいいです。また、メールを書いてもいいです。一度、学科の建物にも来てみてください。学生食堂も近くにあってとても便利です。今度、いっしょに学生食堂に行ってみましょう。また、学生食堂の前の大きいキャンパスにもいっしょに行きましょう。キャンパスの中には大きなカフェテリアとかローマ大学のショップとかがあっておもしろいです。みなさん、ローマ大学で楽しく勉強してください。ローマ大学日本語チューター":"Come va lo studio all’Università di Roma? Da quando siete arrivati avete qualche problema? Noi siamo studenti di giapponese dell’Università di Roma. Aiutiamo gli studenti giapponesi, quindi diteci qualsiasi cosa. Potete telefonarci, o anche scriverci una mail. Venite una volta anche all’edificio del dipartimento. Anche la mensa è vicina ed è molto comoda. La prossima volta andiamo insieme alla mensa. E andiamo insieme anche nel grande campus davanti alla mensa: dentro ci sono una grande caffetteria, il negozio dell’Università di Roma e altro, è interessante. Studiate con piacere all’Università di Roma! I tutor di giapponese dell’Università di Roma",

"千春さんは子供のころ、日本で何度も旅行しました。いろいろな所へ行ったことがあります。日光や長野や広島などに行ったことがあります。旅行では有名な公園をみたり、その町のおいしいものを食べたり、お寺に行ったりしました。千春さんは今ローマ大学の学生です。イタリアでもいろいろな所へ行きたいと思っています。千春さんは日本でイタリア語の先生になりたいと思っています。今、ローマにいます。テレビを見たり、ラジオを聞いたり、イタリア人の友だちと話したりしてイタリア語を毎日勉強します。":"Da bambina Chiharu ha viaggiato molte volte in Giappone. È stata in tanti posti: Nikkō, Nagano, Hiroshima e altri. Nei viaggi visitava parchi famosi, mangiava le cose buone del luogo, andava nei templi. Ora Chiharu è una studentessa dell’Università di Roma. Anche in Italia vorrebbe andare in tanti posti. Pensa di voler diventare insegnante di italiano in Giappone. Adesso è a Roma. Studia italiano ogni giorno guardando la TV, ascoltando la radio, parlando con amici italiani.",
"千春さんは子供のころどこで旅行をしましたか。":"Dove ha viaggiato Chiharu da bambina?","千春さんはどこへ行きましたか。":"Dove è andata Chiharu?","千春さんは今どこにいますか。":"Dove si trova adesso Chiharu?","千春さんは何になりたいと思っていますか。":"Cosa pensa di voler diventare Chiharu?","イタリア語はどのように勉強しますか。":"Come studia l’italiano?",
"私は日本の文学がとても好きです。高校で日本の小説をたくさん読みました。日本のまんがも大好きです。日本の小説では夏目そうせきのこころという本が好きです。とてもおもしろい小説です。イタリア語で読んだことがありますが、日本語で読んだことはありません。日本語で読んでみたいです。フィレンツェの本屋さんにこの本がありました。日本語の本がほしいです。そうせきはたくさん小説を書きました。そうせきの小説もほかの日本の小説もイタリア語でとてもたくさんあります。日本の小説をたくさん読んだ方がいいです。":"Mi piace molto la letteratura giapponese. Al liceo ho letto tanti romanzi giapponesi. Adoro anche i manga. Tra i romanzi giapponesi mi piace “Kokoro” di Natsume Sōseki. È un romanzo molto interessante. L’ho letto in italiano, ma mai in giapponese. Vorrei provare a leggerlo in giapponese. In una libreria di Firenze c’era questo libro. Vorrei il libro in giapponese. Sōseki ha scritto tanti romanzi. I romanzi di Sōseki e degli altri autori giapponesi ci sono in grande quantità anche in italiano. Faresti bene a leggere tanti romanzi giapponesi.",
"高校で何をたくさん読みましたか。":"Cosa ha letto tanto al liceo?","日本の誰の小説がすきですか。":"Quale scrittore giapponese le piace?","それをイタリア語で読みましたか。":"L’ha letto in italiano?","その小説の日本語の本はどこにありますか。":"Dove si trova il libro in giapponese di quel romanzo?","そうせきは小説をどのくらい書きましたか。":"Quanti romanzi ha scritto Sōseki?","イタリアでは日本の小説のイタリア語の本はたくさんありますか。":"In Italia ci sono tanti romanzi giapponesi tradotti in italiano?",

"来月、森さんはイタリアの大学で初めて試験を受けます。とても心配しています。そこで、友だちに聞きました。友だちはあまり心配しない方がいいですよ。と言いました。今週で授業は全部終わりますので、来週からは授業に行かなくてもいいです。毎日試験勉強ができます。来週の月曜日から毎日朝から晩まで図書館で勉強ができます。図書館は夜の10時まで勉強ができますので、食事は学生食堂で食べます。学生食堂はおいしいですので、いつも利用しています。":"Il mese prossimo Mori sosterrà per la prima volta un esame in un’università italiana. È molto preoccupato. Così ha chiesto a un amico. L’amico gli ha detto: «È meglio non preoccuparsi troppo». Con questa settimana le lezioni finiscono tutte, quindi dalla prossima settimana non è necessario andare a lezione. Può studiare per l’esame ogni giorno. Da lunedì prossimo può studiare in biblioteca ogni giorno dalla mattina alla sera. In biblioteca si può studiare fino alle 10 di sera, quindi i pasti li fa alla mensa universitaria. La mensa è buona, quindi la usa sempre.",
"森さんはいつ試験がありますか。":"Quando ha l’esame Mori?","森さんの友だちは試験について何と言いましたか。":"Che cosa ha detto l’amico di Mori a proposito dell’esame?","授業はいつ終わりますか。":"Quando finiscono le lezioni?","来週から森さんは何をしますか。":"Che cosa farà Mori dalla prossima settimana?","森さんはどこで勉強しますか。":"Dove studia Mori?","森さんはいつもどこでご飯を食べますか。":"Dove mangia sempre Mori?",
"千春さん、お久しぶりです。お元気ですか。イタリアの生活は楽しいですか。私はドイツのハンブルク大学で勉強しています。ドイツ語とドイツ文学を勉強しています。ハンブルクはとても寒いですが、きれいな町でとても便利です。千春さんはイタリア語は上手になりましたか。私は毎日ドイツ語をいっしょうけんめいに勉強しています。ところで、イースターにハンブルクに来ますね。私の部屋がありますので、ホテルは心配しないでください。ホテルを予約しなくてもいいです。私の部屋でねてください。ローマからハンブルクまで安いチケットがありますから、探してみてください。食事は私の大学の学生食堂が安くておいしいです。いっしょに行きましょう。ハンブルクの近くにはきれいで小さい町がたくさんありますので、一日旅行をしましょう。2月は大学の試験がありますね。がんばってください。では、楽しみにしています。みか":"Chiharu, è da tanto che non ci sentiamo. Come stai? La vita in Italia è divertente? Io studio all’Università di Amburgo, in Germania. Studio la lingua e la letteratura tedesca. Amburgo è molto fredda, ma è una bella città e molto comoda. Sei diventata brava in italiano? Io studio tedesco ogni giorno con molto impegno. A proposito, a Pasqua vieni ad Amburgo, vero? C’è la mia stanza, quindi non preoccuparti per l’albergo. Non è necessario prenotare un albergo. Dormi pure nella mia stanza. Da Roma ad Amburgo ci sono biglietti economici, prova a cercarli. Per mangiare, la mensa della mia università è economica e buona. Andiamoci insieme. Vicino ad Amburgo ci sono tante cittadine belle e piccole, quindi facciamo una gita di un giorno. A febbraio hai gli esami all’università, vero? In bocca al lupo! Allora, non vedo l’ora. Mika",

// numeri arabi → kanji (2時間 = 二時間), ぐらい = くらい, へ = に (direzione), così le varianti equivalenti sono accettate
function kanjiNum(n){const d="〇一二三四五六七八九";if(!n)return "〇";let s="";for(const [v,c] of [[10000,"万"],[1000,"千"],[100,"百"],[10,"十"]]){const q=Math.floor(n/v);if(q){s+=(q>1||v===10000?kanjiNum(q):"")+c;n%=v}}return s+(n?d[n]:"")}
function answerNorm(s){return String(s||"").normalize("NFKC").replace(/\d+/g,m=>kanjiNum(+m)).replace(/ぐらい/g,"くらい").replace(/じゃありません/g,"ではありません").replace(/へ/g,"に")}
function exAnswerMatch(given,expected){const base=(a,b)=>nz(String(a||""))==nz(String(b||""))||kanaEquivalent(a)==kanaEquivalent(b);return base(given,expected)||base(answerNorm(given),answerNorm(expected))}
function fillPromptHtml(x){let i=0;return japanesePrompt(x).replace(/[（(][　 ]*[）)]/g,()=>`（<input class="ex-inline-blank" aria-label="Particella ${++i}" maxlength="8" autocomplete="off" onkeydown="if(event.key==='Enter')exFillSubmit()">）`)}
// ===== Valutazione: kanji e kana valgono allo stesso modo (才 = さい, 行きます = いきます) =====
// Eccezione: se l'esercizio chiede proprio di scrivere in kanji / hiragana / katakana, conta la scrittura richiesta.
const toHira=s=>Array.from(String(s||""),c=>{const n=c.codePointAt(0);return n>=0x30a1&&n<=0x30f6?String.fromCodePoint(n-0x60):c}).join("");
// letture di ogni kanji studiato (on e kun, senza okurigana) per riconoscere un kanji scritto al posto della sua lettura
const KANJI_READ={};K.forEach(k=>{const set=KANJI_READ[k[0]]=KANJI_READ[k[0]]||new Set();String(k[1]+"、"+k[2]).split(/[、,]/).map(r=>r.trim()).filter(r=>r&&r!=="—").forEach(r=>{const h=toHira(r.replace(/[()（）]/g,""));set.add(h.replace(/・/g,""));set.add(h.split("・")[0])})});
function sameAnswer(given,expected){const g=nz(String(given||"")).normalize("NFKC"),e=nz(String(expected||"")).normalize("NFKC");if(!g)return false;if(g.toLowerCase()===e.toLowerCase())return true;if(exAnswerMatch(g,e))return true;
 // un solo kanji al posto della sua lettura (o viceversa): 才 ↔ さい, 時 ↔ じ
 const one=(k,r)=>k.length===1&&KANJI_READ[k]&&KANJI_READ[k].has(toHira(r));return one(g,e)||one(e,g)}
function strictScript(x,expected){const q=String(x[2]||""),e=String(expected||"");
 if(x[0]!=="tx")return "";  // negli esercizi da completare kanji e kana valgono sempre entrambi
 if(/Scrivi in katakana|Scrivi in hiragana|lettura .*in hiragana|\(in hiragana\)|\(in katakana\)|ひらがなで書いて|カタカナで書いて|Riordina le sillabe/.test(q)&&!/[一-鿿]/.test(e))return "kana";
 if(/Scrivi il kanji|Scrivi i kanji|Scrivi in kanji|漢字で書いて|okurigana/i.test(q)&&/[一-鿿]/.test(e))return "kanji";return ""}
function exCheck(x,given,expected){const mode=strictScript(x,expected),g=nz(String(given||"")).normalize("NFKC"),e=nz(String(expected||"")).normalize("NFKC");
 if(mode==="kana")return g===e||answerNorm(g)===answerNorm(e)&&!/[一-鿿]/.test(g);  // la scrittura (hiragana o katakana) deve essere quella richiesta
 if(mode==="kanji")return /[一-鿿]/.test(g)&&(g===e||sameAnswer(g,e)&&toHira(g).replace(/[ぁ-ゖ]/g,"")===toHira(e).replace(/[ぁ-ゖ]/g,""));  // servono gli stessi kanji
 return sameAnswer(g,e)}
function exFillSubmit(){const x=EX[eq[ei]],fields=[...document.querySelectorAll(".ex-prompt .ex-inline-blank")],vals=fields.map(f=>f.value.trim());
 // ogni spazio si confronta con la parte corrispondente della soluzione (separata da ・); "x" = nessuna particella
 const ok=vals.length>0&&x[3].some(a=>{const parts=String(a).split(/[・･]/).map(s=>s.trim());if(parts.length===vals.length)return parts.every((p,i)=>p.toLowerCase()==="x"?/^[xX×✕]?$/.test(vals[i]):exCheck(x,vals[i],p));return exCheck(x,vals.join(""),String(a).replace(/[・･,，\s　]/g,""))});fin(ok,x[3][0]+"。")}
function exTx(){const x=EX[eq[ei]],v=$("in").value;fin(x[3].some(a=>exCheck(x,v,a)),x[3][0]+"。")}
function exWrite(){const x=EX[eq[ei]],v=$("in").value.trim();if(!v){$("fb").innerHTML=`<div class="g">Scrivi prima una risposta.</div>`;return}document.querySelectorAll("#bd textarea,#bd button").forEach(o=>o.disabled=true);const answer=x[3][0],roma=exRoma(answer),romanHtml=roma?'<details class="answer-romaji"><summary>Mostra il romanji</summary><div>'+roma+'</div></details>':'';$("fb").innerHTML=`<div class="g ex-feedback"><b>Confronta la tua risposta</b><br><span class="mu">La tua risposta</span><br>${v.replace(/</g,"&lt;").replace(/>/g,"&gt;")}<hr><span class="mu">Risposta esempio</span><div class="jp-answer">${answer}</div>${romanHtml}</div><div class="row"><button class="btn ok" onclick="fin(true,EX[eq[ei]][3][0])">La risposta va bene</button><button class="btn ko" onclick="fin(false,EX[eq[ei]][3][0])">Devo riprovare</button></div>`}
