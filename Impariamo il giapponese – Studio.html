.li button{border:0;background:none;color:var(--ko);font-size:18px;cursor:pointer}
.btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}

h1{font-size:20px;margin:4px 0 12px}h1 small{color:var(--mu);font-weight:400;font-size:13px;display:block}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}

nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer}.kanji-pad-wrap{width:min(100%,420px);margin:8px auto 0;text-align:left}.kanji-pad{display:block;width:100%;height:180px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);touch-action:none;cursor:crosshair}.kanji-pad-label{font-size:13px;color:var(--mu);margin-bottom:5px}.kanji-hints{font-size:18px;line-height:1.7}.kanji-clue{font-size:20px;font-weight:600}.kanji-pad-clear{margin-top:7px;padding:6px 10px;font-size:14px}.kanji-drawing-preview{display:block;width:min(100%,420px);height:145px;margin:10px auto 0;border:1px solid var(--bd);border-radius:10px;object-fit:contain;background:var(--bg)}.stroke-order-wrap{width:min(100%,320px);margin:10px auto 0}.stroke-order-svg{display:block;width:100%;height:auto;max-height:300px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}.stroke-order-status{text-align:center;color:var(--mu);font-size:13px;margin:5px 0}.stroke-order-credit{text-align:center;color:var(--mu);font-size:11px;margin-top:5px}.stroke-order-credit a{color:var(--ac)}

.ex-prompt{font-size:19px;line-height:1.8;white-space:pre-line;padding:18px;margin-bottom:12px}

const G=[[1,"です (copula)","Il predicato nominale è un nome + です, che vale “essere”. Con か finale diventa domanda.","私の犬は12キロです。 Watashi no inu wa 12 kiro desu. “Il mio cane pesa 12 chili.”"],[1,"の (specificazione)","Lega due nomi: il primo specifica o modifica il secondo, che viene dopo.","日本語の学生 nihongo no gakusei = studente di lingua giapponese"],[1,"方 kata / 人 jin","Entrambi = “persona”. 方 è più formale (2ª e 3ª persona) e si lega con の; 人 è meno formale e si attacca al nome (日本人).","日本の方 nihon no kata · 日本人 nihonjin"],[1,"は (tema)","La particella は (si legge “wa”) evidenzia il tema/soggetto della frase.","川口さんは学生です。"],[1,"さん","Suffisso dopo il nome della 2ª e 3ª persona, mai della 1ª.","山下さん Yamashita-san"],[1,"Negazione di です","ではありません dewaarimasen oppure じゃありません jaarimasen. Non cambia con numero o genere.","川口さんは山下さんの友だちじゃありません。"],[1,"そうですか","“Davvero?”, “Ah sì?”: mostra che hai capito e che sei interessato alla conversazione.","そうですか。Sō desu ka."],[1,"か (domanda)","Quando です è seguito dalla particella finale か, la frase diventa una domanda.","あなたはかいしゃいんですか。 “È un impiegato?”"],[1,"ええ","Usato nelle risposte affermative, più colloquiale di はい. Come そうですか, mostra anche interesse nella conversazione.","ええ、そうです。"],[1,"へえ","Esclamazione informale che sottolinea stupore.","へえ hē"],[1,"何 nan / nani","Pronome interrogativo “che cosa?”. Quando 何 compare nella frase, questa termina con か.","あなたのしゅみは何ですか。"],[1,"も (anche)","Particella enfatica che significa “anche”, riferita al sostantivo che la precede.","マリアさんもアラビア語の学生です。 “Anche Maria è una studentessa di arabo.”"],[1,"と (e)","Tra due sostantivi equivale alla congiunzione “e”.","わたしのしゅみはえいがとおんがくです。 “I miei hobby sono il cinema e la musica.”"],[1,"Omissione del predicato","Se l’argomento è chiaro, si può lasciare solo il soggetto e dire la frase con intonazione ascendente, come una domanda.","お名前は？ Onamae wa? “Il suo nome?”"],
[2,"Dimostrativi: これ・それ・あれ","I pronomi dimostrativi indicano una persona o una cosa senza nominarla: これ (vicino a chi parla), それ (vicino a chi ascolta), あれ (lontano da entrambi). Non cambiano per genere o numero.","これは何ですか。 Kore wa nan desu ka. “Che cos’è questo?”"],
[2,"Dimostrativi: この・その・あの","Queste forme accompagnano sempre un nome: この本 = questo libro; その本 = quel libro vicino a chi ascolta; あの建物 = quell’edificio laggiù. Non usarle da sole.","この本は日本語の本です。 Kono hon wa nihongo no hon desu."],
[2,"誰・誰の (chi / di chi)","誰 (dare) significa “chi?”. Con の diventa 誰の (dare no), “di chi?”. La particella の si usa come nell’Unità 1 per indicare possesso o specificazione.","これは誰の本ですか。 Kore wa dare no hon desu ka. “Di chi è questo libro?”"],
[2,"Omissione del nome già noto","Se dal contesto è chiaro il nome sottinteso, dopo の si può omettere. La regola riprende l’omissione del predicato vista nell’Unità 1.","それはエレナさんの（本）です。 Sore wa Erena-san no (hon) desu."],
[2,"Mesi: numero + 月","Per i mesi si usa il numero di origine cinese seguito da 月 (がつ, gatsu): 一月 ichigatsu (gennaio), 二月 nigatsu (febbraio), 九月 kugatsu (settembre). 何月 (なんがつ, nangatsu) significa “quale mese?”.","誕生日は何月ですか。 Tanjōbi wa nangatsu desu ka."],
[2,"Giorni del mese","I primi dieci giorni hanno letture irregolari: 一日ついたち, 二日ふつか, 三日みっか, 四日よっか, 五日いつか, 六日むいか, 七日なのか, 八日ようか, 九日ここのか, 十日とおか. Attenzione anche a 十四日じゅうよっか, 二十日はつか e 二十四日にじゅうよっか.","誕生日は五月二十日です。 Tanjōbi wa gogatsu hatsuka desu."],
[2,"Compleanno: いつ","いつ (itsu) significa “quando?”. Per chiedere la data si può usare 誕生日はいつですか. Per precisare mese e giorno si usano i contatori 月 e 日.","モリさんの誕生日はいつですか。 Mori-san no tanjōbi wa itsu desu ka."],
[2,"Età: ～歳・何歳","歳 (さい, sai) è il contatore degli anni di età; 何歳 (なんさい, nansai) chiede “quanti anni?”. La forma tradizionale per vent’anni è はたち (二十歳). Alcuni numeri cambiano pronuncia davanti a sai: いっさい, はっさい, はたち.","モリさんは二十一歳です。 Mori-san wa nijūissai desu."],
[2,"Numeri di telefono","Per leggere un numero di telefono si pronunciano le cifre una per una, senza un contatore. 何番 (なんばん, nanban) chiede “quale numero?”. La struttura delle domande con ですか riprende l’Unità 1.","電話番号は何番ですか。 Denwa bangō wa nanban desu ka."],
[2,"Ripasso: は・です・か insieme ai dimostrativi","Per fare una domanda con un dimostrativo, conserva la struttura già studiata: tema + は + nome/predicato + です + か. の può aggiungere una specificazione o indicare il proprietario.","あの建物は美術館ですか。 Ano tatemono wa bijutsukan desu ka."],
[3,"どこ・どこの: chiedere dove","どこ (doko) è l’interrogativo “dove?”. どこの + nome chiede “di quale luogo?”. La struttura riprende は, の e です già studiati.","レストランはどこですか。 Resutoran wa doko desu ka."],
[3,"おいしい: l’aggettivo prima del nome","おいしい (oishii) significa “buono, delizioso” ed è un aggettivo in い. In questa unità si osserva che l’aggettivo precede il nome; la coniugazione si affronta nell’Unità 7.","おいしい日本料理。 Oishii Nihon ryōri."],
[3,"ええと: prendere tempo mentre si pensa","ええと (ēto) è un’espressione usata durante una pausa, mentre si pensa a cosa rispondere: “dunque…”, “vediamo…”.","ええと、本を二冊とCDを七枚。 Ēto, hon o ni-satsu to CD o nanamai."],
[3,"Questo posto e laggiù: ここ・そこ・あそこ","ここ indica un luogo vicino a chi parla, そこ un luogo vicino a chi ascolta e あそこ un luogo lontano da entrambi. Per accompagnare un nome si riprendono le forme già studiate この・その・あの. Nel dialogo compare anche この近く, “qui vicino”.","本屋さんはあそこです。 Honya-san wa asoko desu."],
[3,"Piani: ～階・何階","階 (かい, kai) è il classificatore per i piani di un edificio. Si combina con il numero; il libro richiama la variazione fonetica di 三階 (さんがい, sangai). Per chiedere il piano si usa 何階 (なんがい, nangai).","あのレストランは二階です。 Ano resutoran wa nikai desu."],
[3,"Libri e volumi: ～冊","冊 (さつ, satsu) è il classificatore usato per contare libri e quaderni. Si mette dopo il numero: 二冊, 三冊. Anche qui alcune combinazioni cambiano suono, come mostrato nello schema.","本を二冊とノートを三冊ください。 Hon o ni-satsu to nōto o san-satsu kudasai."],
[3,"Oggetti piatti e sottili: ～枚","枚 (まい, mai) è il classificatore per oggetti piatti e sottili, come francobolli e cartoline. Il numero precede 枚; le letture nello schema mostrano la forma regolare.","切手を五枚ください。 Kitte o go-mai kudasai."],
[3,"Oggetti cilindrici: ～本","本 (ほん, hon) si usa per contare oggetti lunghi o cilindrici. Il suono cambia in alcune combinazioni: nel libro compare 六本, letto ろっぽん; per chiedere “quanti?” si usa 何本, letto なんぼん.","やきとりを三本ください。 Yakitori o san-bon kudasai."],
[3,"Chiedere il prezzo: いくら","いくら (ikura) è l’interrogativo usato per chiedere il prezzo: nome は いくらですか. Per rispondere si dice l’importo e poi la valuta. Euro, dollari e yen indicano già l’unità monetaria, quindi non richiedono un altro classificatore.","これはいくらですか。 Kore wa ikura desu ka."],
[3,"は come tema: “per quanto mi riguarda”","Nella frase 私はさしみランチ, は introduce il tema “per quanto mi riguarda”. In questo uso non presenta 私 come soggetto grammaticale di un predicato: specifica a chi si riferisce l’ordine.","私はさしみランチ。 Watashi wa sashimi ranchi."] ,
